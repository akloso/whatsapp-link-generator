name: Splitzap Testing UX Enhancement

on:
  push:
    branches: [testing]
    paths:
      - .github/workflows/splitzap-testing-ux-enhancement.yml

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing
          fetch-depth: 0

      - name: Apply UX patch
        run: python3 .github/splitzap_ux_patch.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Commit enhancements
        run: |
          git config user.name "Splitzap Enhancement"
          git config user.email "actions@users.noreply.github.com"
          git add src/features/splitzap/SplitzapAppV4.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Refine Splitzap expense UX and settlement insights"
          git push origin testing
