name: Splitzap Testing UX Enhancement

on:
  push:
    branches: [testing]
    paths:
      - .github/workflows/splitzap-testing-ux-enhancement.yml

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing
          fetch-depth: 0

      - name: Apply UX patch
        run: python3 .github/splitzap_ux_patch.py

      - name: Repair share newline escape
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/features/splitzap/SplitzapAppV4.tsx')
          s = p.read_text()
          broken = "return lines.join('" + "\n" + "');"
          fixed = "return lines.join('\\n');"
          if broken not in s:
              raise SystemExit('broken newline marker not found')
          p.write_text(s.replace(broken, fixed, 1))
          PY

      - name: Show generated Add Expense and dialogs
        run: nl -ba src/features/splitzap/SplitzapAppV4.tsx | sed -n '400,550p'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck
