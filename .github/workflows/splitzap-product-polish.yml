name: Splitzap Product Polish

on:
  push:
    branches:
      - testing
    paths:
      - scripts/splitzap_product_polish.py
      - .github/workflows/splitzap-product-polish.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout testing
        uses: actions/checkout@v4
        with:
          ref: testing
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply approved Splitzap polish
        run: python3 scripts/splitzap_product_polish.py

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: Splitzap tests
        run: npm run test:splitzap

      - name: Production build
        run: npm run build

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Ensure no user-facing Supabase wording remains
        run: |
          if grep -nEi "Supabase|2-per-hour test|test sender" src/features/splitzap/SplitzapCloudApp.tsx; then
            echo "Technical provider/test wording leaked into user-facing Splitzap UI."
            exit 1
          fi

      - name: Verify approved UX markers
        run: |
          grep -q "Share group summary" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "Close group menu" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "Scan receipt" src/features/splitzap/SplitzapAppV4.tsx
          test "$(grep -o "Scan receipt" src/features/splitzap/SplitzapAppV4.tsx | wc -l)" -eq 2
          ! grep -q "More options" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "Remove from group" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "Sign in to Splitzap" src/features/splitzap/SplitzapCloudApp.tsx
          ! grep -q "Move this device's Splitzap data online" src/features/splitzap/SplitzapCloudApp.tsx
          ! grep -q "Two different Splitzap copies found" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "Offline · changes saved on this device" src/features/splitzap/SplitzapCloudApp.tsx

      - name: Remove temporary patch machinery
        run: |
          rm scripts/splitzap_product_polish.py
          rm .github/workflows/splitzap-product-polish.yml

      - name: Commit validated production polish
        run: |
          if git diff --quiet; then
            echo "No source changes produced."
            exit 1
          fi
          git config user.name "splitzap-production-bot"
          git config user.email "splitzap-production-bot@users.noreply.github.com"
          git add -A
          git commit -m "Polish Splitzap production UX and account safety"
          git push origin HEAD:testing
