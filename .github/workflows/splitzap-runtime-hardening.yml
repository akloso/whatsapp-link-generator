name: Splitzap Runtime Hardening

on:
  push:
    branches:
      - testing
    paths:
      - scripts/splitzap_runtime_hardening.py
      - .github/workflows/splitzap-runtime-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout testing
        uses: actions/checkout@v4
        with:
          ref: testing
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply, validate and commit
        shell: bash
        run: |
          set -uo pipefail

          report_failure() {
            stage="$1"
            log_file="$2"
            {
              echo "FAILED_STAGE=$stage"
              echo "RUN_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo
              tail -n 500 "$log_file" 2>/dev/null || true
            } > .splitzap-runtime-error.log
            git reset -- . >/dev/null 2>&1 || true
            git config user.name "splitzap-runtime-bot"
            git config user.email "splitzap-runtime-bot@users.noreply.github.com"
            git add .splitzap-runtime-error.log
            git commit -m "Record Splitzap runtime hardening validation failure" || true
            git push origin HEAD:testing
            exit 1
          }

          python3 scripts/splitzap_runtime_hardening.py > /tmp/apply.log 2>&1 || report_failure "apply_patch" /tmp/apply.log
          npm ci > /tmp/npm-ci.log 2>&1 || report_failure "npm_ci" /tmp/npm-ci.log
          npm run typecheck > /tmp/typecheck.log 2>&1 || report_failure "typecheck" /tmp/typecheck.log
          npm run test:splitzap > /tmp/tests.log 2>&1 || report_failure "splitzap_tests" /tmp/tests.log
          npm run build > /tmp/build.log 2>&1 || report_failure "production_build" /tmp/build.log
          npm audit --omit=dev --audit-level=high > /tmp/audit.log 2>&1 || report_failure "production_audit" /tmp/audit.log

          {
            grep -q "clearPendingJoinIntent" src/features/splitzap/SplitzapCloudApp.tsx
            grep -q "preview.already_joined" src/features/splitzap/SplitzapCloudApp.tsx
            grep -q "Token refresh / same-account auth events" src/features/splitzap/SplitzapCloudApp.tsx
            grep -q "Install Splitzap" src/features/splitzap/SplitzapCloudApp.tsx
            grep -q "Settle related balance" src/features/splitzap/SplitzapAppV4.tsx
            grep -q "current simplified transfer as paid" src/features/splitzap/SplitzapAppV4.tsx
            grep -q "splitzap-main-scroll" src/features/splitzap/SplitzapAppV4.tsx
            grep -q "splitzap.expenseDraft" src/features/splitzap/SplitzapAppV4.tsx
            grep -q "fixed-shell and mobile touch hardening" src/features/splitzap/splitzap.css
            grep -q "persistSession: true" src/features/splitzap/splitzapCloud.ts
            grep -q "autoRefreshToken: true" src/features/splitzap/splitzapCloud.ts
            ! grep -q "screen-enter mx-auto min-h-\[100dvh\]" src/features/splitzap/SplitzapAppV4.tsx
          } > /tmp/assertions.log 2>&1 || report_failure "runtime_assertions" /tmp/assertions.log

          rm -f .splitzap-runtime-error.log
          rm scripts/splitzap_runtime_hardening.py
          rm .github/workflows/splitzap-runtime-hardening.yml

          git config user.name "splitzap-runtime-bot"
          git config user.email "splitzap-runtime-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No validated source changes produced." > /tmp/nochanges.log
            report_failure "no_changes" /tmp/nochanges.log
          fi
          git commit -m "Harden Splitzap runtime continuity and settlement UX"
          git push origin HEAD:testing

# trigger after workflow registration
