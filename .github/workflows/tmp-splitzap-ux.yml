name: TEMP Splitzap UX and Payment Hardening

on:
  pull_request:
    branches: [main]
    paths:
      - '.tmp-splitzap-ux-trigger'

permissions:
  contents: write

jobs:
  patch-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply scoped Splitzap patch
        run: python scripts/tmp_splitzap_ux_patch.py
      - name: Enlarge Splitzap app icon artwork
        shell: bash
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          for name in ('splitzap-icon-192.png', 'splitzap-icon-512.png'):
              path = Path('public') / name
              image = Image.open(path).convert('RGBA')
              width, height = image.size
              scale = 1.24
              enlarged = image.resize((round(width * scale), round(height * scale)), Image.Resampling.LANCZOS)
              left = (enlarged.width - width) // 2
              top = (enlarged.height - height) // 2
              cropped = enlarged.crop((left, top, left + width, top + height))
              cropped.save(path, optimize=True)
              print(f'{name}: {width}x{height}, artwork zoom {scale:.2f}x')
          PY
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Splitzap regression tests
        run: npm run test:splitzap
      - name: Production build
        run: npm run build
      - name: Production dependency security gate
        run: npm audit --omit=dev --audit-level=high
      - name: UX and financial-safety assertions
        shell: bash
        run: |
          grep -q "Payment recorded" src/features/splitzap/SplitzapAppV4.tsx
          grep -q ">Undo</button>" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "Note (optional)" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "View details" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "HomeBalanceSheet" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "splitzap-home-center" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "sheet-panel--tall" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "apple-mobile-web-app-title" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "splitzap.upiPending" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "Did you complete the payment?" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "Scan UPI QR" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "has not shared a UPI ID" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "Mark received" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "balance kept visible" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "note?: string" src/features/splitzap/splitStoreV4.ts
          grep -q "splitzapPaymentSafety" src/features/splitzap/splitzapSyncSafety.test.ts
          grep -q "window.history.replaceState({}, '', '/splitzap')" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "fixed left-1/2 top-" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "Splitzap — Split bills, not bonds" src/App.tsx
          test -f public/splitzap-icon-192.png
          test -f public/splitzap-icon-512.png
          ! git diff -- src/features/splitzap/SplitzapAppV4.tsx | grep -q "function ReceiptScanner"
      - name: Commit validated source only
        shell: bash
        run: |
          git config user.name "splitzap-ux-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .tmp-splitzap-ux-trigger
          git add \
            src/App.tsx \
            src/features/splitzap/SplitzapAppV4.tsx \
            src/features/splitzap/SplitzapCloudApp.tsx \
            src/features/splitzap/splitStoreV4.ts \
            src/features/splitzap/splitzap.css \
            src/features/splitzap/splitzapPaymentSafety.ts \
            src/features/splitzap/splitzapSyncSafety.test.ts \
            public/splitzap-icon-192.png \
            public/splitzap-icon-512.png
          git commit -m "Harden Splitzap mobile settlement and payment UX"
          git push origin HEAD:testing
