name: Splitzap UPI Receipt Upgrade

on:
  push:
    branches: [testing]
    paths:
      - 'scripts/splitzap-upi-receipt.part*'
      - '.github/workflows/splitzap-upi-receipt.yml'

permissions:
  contents: write

jobs:
  apply-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Reconstruct and apply approved patch
        shell: bash
        run: |
          cat scripts/splitzap-upi-receipt.part1 scripts/splitzap-upi-receipt.part2 scripts/splitzap-upi-receipt.part3 | base64 -d | gzip -d > /tmp/splitzap-upi-receipt.py
          python3 /tmp/splitzap-upi-receipt.py
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Splitzap calculation tests
        run: npm run test:splitzap
      - name: Production build
        run: npm run build
      - name: Production dependency security gate
        run: npm audit --omit=dev --audit-level=high
      - name: Approved feature assertions
        shell: bash
        run: |
          grep -q "splitzap_get_payment_profile" src/features/splitzap/splitzapProduction.ts
          grep -q "splitzap_update_payment_profile" src/features/splitzap/splitzapProduction.ts
          grep -q "splitzap_get_group_member_upi" src/features/splitzap/splitzapProduction.ts
          grep -q "splitzap_parse_receipt_text" src/features/splitzap/splitzapProduction.ts
          grep -q "Allow group members to pay me via UPI" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "Pay with UPI" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "upi://pay" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "Did you complete the payment?" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "paymentMode === 'partial'" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "memberIds?: string\[\]" src/features/splitzap/splitStoreV4.ts
          grep -q "Same as previous" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "Receipt total matched" src/features/splitzap/SplitzapAppV4.tsx
          ! grep -q "function parseReceiptText" src/features/splitzap/SplitzapAppV4.tsx
      - name: Commit validated Splitzap source
        shell: bash
        run: |
          git config user.name "splitzap-upgrade-bot"
          git config user.email "splitzap-upgrade-bot@users.noreply.github.com"
          git add src/features/splitzap/SplitzapAppV4.tsx src/features/splitzap/SplitzapCloudApp.tsx src/features/splitzap/splitzapProduction.ts src/features/splitzap/splitStoreV4.ts
          git commit -m "Add Splitzap UPI payments and receipt intelligence"
          git push origin HEAD:testing
