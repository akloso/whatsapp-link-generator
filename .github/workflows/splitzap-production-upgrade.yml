name: Splitzap Production Upgrade

on:
  push:
    branches: [testing]
    paths:
      - scripts/splitzap-production-upgrade.mjs
      - .github/workflows/splitzap-production-upgrade.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: splitzap-production-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout testing
        uses: actions/checkout@v4
        with:
          ref: testing
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply guarded Splitzap patch
        run: node scripts/splitzap-production-upgrade.mjs

      - name: TypeScript
        run: npm run typecheck

      - name: Splitzap regression tests
        run: npm run test:splitzap

      - name: Production build
        run: npm run build

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Commit validated changes
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "splitzap-upgrade-bot"
          git config user.email "splitzap-upgrade-bot@users.noreply.github.com"
          git add src package.json package-lock.json
          git commit -m "Implement Splitzap production hardening phase"
          git push origin HEAD:testing
