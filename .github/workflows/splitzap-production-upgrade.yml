name: Splitzap Production Upgrade

on:
  push:
    branches: [testing]
    paths:
      - scripts/splitzap-production-upgrade.mjs
      - scripts/splitzap-production-ui.mjs
      - scripts/run-splitzap-production-ui.mjs
      - scripts/validate-splitzap-production.mjs
      - scripts/splitzap-fragments/**
      - .github/workflows/splitzap-production-upgrade.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: splitzap-production-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout testing
        uses: actions/checkout@v4
        with:
          ref: testing
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate and validate Splitzap
        id: validate
        continue-on-error: true
        run: node scripts/validate-splitzap-production.mjs

      - name: Commit validated production implementation
        if: steps.validate.outcome == 'success'
        run: |
          git config user.name "splitzap-upgrade-bot"
          git config user.email "splitzap-upgrade-bot@users.noreply.github.com"
          git add src .github/workflows/splitzap-readiness.yml package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Implement Splitzap production collaboration and UX"
            git push origin HEAD:testing
          fi

      - name: Commit validation diagnostic
        if: steps.validate.outcome == 'failure'
        run: |
          git config user.name "splitzap-upgrade-bot"
          git config user.email "splitzap-upgrade-bot@users.noreply.github.com"
          git add scripts/splitzap-upgrade-diagnostic.log
          if ! git diff --cached --quiet; then
            git commit -m "Capture Splitzap upgrade validation failure"
            git push origin HEAD:testing
          fi
          exit 1
