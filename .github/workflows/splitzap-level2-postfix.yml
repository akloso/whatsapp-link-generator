name: Splitzap Level 2 Identity Fix

on:
  push:
    branches: [testing]
    paths:
      - '.github/splitzap_level2_postfix.py'
      - '.github/workflows/splitzap-level2-postfix.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply identity fixes
        run: python .github/splitzap_level2_postfix.py
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Splitzap tests
        run: npm run test:splitzap
      - name: Production build
        run: npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/splitzap/SplitzapAppV4.tsx src/features/splitzap/splitStoreV4.test.ts
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Fix shared member identity defaults'
            git push origin testing
          fi
