name: Temporary Splitzap Phase 4 settlement trace patch

on:
  push:
    branches: [splitzap-data-hardening]
    paths:
      - '.github/workflows/tmp-splitzap-phase4-trace.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: splitzap-data-hardening
      - name: Apply exact settlement-trace patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/features/splitzap/SplitzapAppV4.tsx')
          text = path.read_text()

          old_logic = "  const rawDebts = data.expenses.filter((expense) => expense.groupId === group.id).flatMap((expense) => expenseSettlement(expense, group).filter((debt) => debt.from === currentMemberId || debt.to === currentMemberId).map((debt) => ({ ...debt, expense })));"
          new_logic = "  const groupMemberIds = group.members.map((member) => member.id);\n  const rawDebts = data.expenses.filter((expense) => expense.groupId === group.id).flatMap((expense) => {\n    const paid = paymentsOf(expense);\n    return expenseSettlement(expense, group)\n      .filter((debt) => debt.from === currentMemberId || debt.to === currentMemberId)\n      .map((debt) => ({\n        ...debt,\n        expense,\n        fromShare: shareOf(expense, debt.from, groupMemberIds),\n        fromPaid: paid[debt.from] ?? 0,\n        toShare: shareOf(expense, debt.to, groupMemberIds),\n        toPaid: paid[debt.to] ?? 0,\n      }));\n  });"
          if text.count(old_logic) != 1:
              raise SystemExit(f'Expected exactly one rawDebts target, found {text.count(old_logic)}')
          text = text.replace(old_logic, new_logic, 1)

          old_ui = '<span className="block truncate text-[10px] text-muted-foreground">{expense.description}</span>'
          new_ui = '<span className="block truncate text-[10px] text-muted-foreground">{expense.description}</span><span className="mt-0.5 block text-[9px] text-muted-foreground">{nameOf(debt.from)}: share {money(debt.fromShare, group.currency)} · paid {money(debt.fromPaid, group.currency)}</span><span className="block text-[9px] text-muted-foreground">{nameOf(debt.to)}: share {money(debt.toShare, group.currency)} · paid {money(debt.toPaid, group.currency)}</span>'
          if text.count(old_ui) != 1:
              raise SystemExit(f'Expected exactly one original-breakdown target, found {text.count(old_ui)}')
          text = text.replace(old_ui, new_ui, 1)

          path.write_text(text)
          PY

          grep -Fq 'fromShare: shareOf(expense, debt.from, groupMemberIds)' src/features/splitzap/SplitzapAppV4.tsx
          grep -Fq ': share {money(debt.fromShare, group.currency)} · paid {money(debt.fromPaid, group.currency)}' src/features/splitzap/SplitzapAppV4.tsx
      - name: Commit Phase 4 UI trace
        shell: bash
        run: |
          git config user.name "Splitzap Phase 4 Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/features/splitzap/SplitzapAppV4.tsx
          git commit -m "Add expense-level settlement trace"
          git push origin HEAD:splitzap-data-hardening
