name: Splitzap Testing Selective Items

on:
  push:
    branches: [testing]
    paths:
      - .github/workflows/splitzap-testing-selective.yml

permissions:
  contents: write

jobs:
  selective:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing
          fetch-depth: 0

      - name: Apply selective item patch
        run: python3 .github/splitzap_selective_patch.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Selective item math test
        run: |
          rm -rf /tmp/splitzap-math
          npx tsc src/features/splitzap/splitStoreV4.ts --target ES2020 --module commonjs --moduleResolution node --esModuleInterop --skipLibCheck --outDir /tmp/splitzap-math
          NODE_PATH="$PWD/node_modules" node <<'NODE'
          const { shareOf } = require('/tmp/splitzap-math/splitStoreV4.js');
          const ids = ['a','b','c','d'];
          const expense = {
            id:'e', groupId:'g', description:'Dinner', amount:500, baseAmount:500,
            paidBy:'a', payments:{a:500},
            split:{a:1,b:1,c:1,d:1}, mode:'equal', category:'food', date:new Date().toISOString(),
            personalItems:[], additionalCharges:[],
            selectiveItems:[{id:'s',description:'Special item',amount:150,memberIds:['a','b','c'],mode:'equal',split:{}}]
          };
          const actual = ids.map(id => shareOf(expense,id,ids));
          const expected = [137.5,137.5,137.5,87.5];
          actual.forEach((value,index) => {
            if (Math.abs(value-expected[index]) > 0.001) throw new Error(`share mismatch ${index}: ${value}`);
          });
          const total = actual.reduce((a,b)=>a+b,0);
          if (Math.abs(total-500)>0.001) throw new Error(`total mismatch: ${total}`);
          console.log('SELECTIVE_MATH_OK', actual);
          NODE

      - name: Commit enhancement
        run: |
          git config user.name "Splitzap Enhancement"
          git config user.email "actions@users.noreply.github.com"
          git add src/features/splitzap/SplitzapAppV4.tsx src/features/splitzap/splitStoreV4.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add Splitzap selective items and auto group icons"
            git push origin HEAD:testing
          fi
