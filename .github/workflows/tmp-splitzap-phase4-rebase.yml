name: Temporary Splitzap Phase 4 rebase caller patch

on:
  push:
    branches: [splitzap-data-hardening]
    paths:
      - '.github/workflows/tmp-splitzap-phase4-rebase.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: splitzap-data-hardening
      - name: Patch shared sync caller after successful entity rebase
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/features/splitzap/SplitzapCloudApp.tsx')
          text = path.read_text()
          old = """            const result = await updateSharedGroup(sharedId, item.snapshot, item.group.sharedRevision);\n            sharedHashes.current.set(sharedId, sharedSnapshotHash(item.snapshot));\n            restartDirtySharedIds.current.delete(sharedId);\n            rememberConfirmedSharedState(session.user.id, confirmedSharedState.current, { id: sharedId, revision: result.revision, snapshot: item.snapshot });\n            update((current) => ({ ...current, groups: current.groups.map((group) => group.id === item.group.id ? { ...group, sharedRevision: result.revision } : group) }));"""
          new = """            const result = await updateSharedGroup(sharedId, item.snapshot, item.group.sharedRevision);\n            const syncedSnapshot = result.snapshot;\n            sharedHashes.current.set(sharedId, sharedSnapshotHash(syncedSnapshot));\n            restartDirtySharedIds.current.delete(sharedId);\n            rememberConfirmedSharedState(session.user.id, confirmedSharedState.current, { id: sharedId, revision: result.revision, snapshot: syncedSnapshot });\n            if (result.rebased) {\n              const refreshed = await fetchSharedGroup(sharedId, session.user.id);\n              if (!refreshed) throw new Error('Could not reload the reconciled shared group.');\n              sharedHashes.current.set(sharedId, sharedSnapshotHash(refreshed.snapshot));\n              rememberConfirmedSharedState(session.user.id, confirmedSharedState.current, refreshed);\n              update((current) => mergeSharedRowsIntoLocal(current, [refreshed], false));\n            } else {\n              update((current) => ({ ...current, groups: current.groups.map((group) => group.id === item.group.id ? { ...group, sharedRevision: result.revision } : group) }));\n            }"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected one shared sync caller target, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          grep -Fq 'const syncedSnapshot = result.snapshot;' src/features/splitzap/SplitzapCloudApp.tsx
          grep -Fq 'if (result.rebased)' src/features/splitzap/SplitzapCloudApp.tsx
          grep -Fq 'mergeSharedRowsIntoLocal(current, [refreshed], false)' src/features/splitzap/SplitzapCloudApp.tsx
      - name: Commit Phase 4 rebase caller fix
        shell: bash
        run: |
          git config user.name "Splitzap Phase 4 Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/features/splitzap/SplitzapCloudApp.tsx
          git commit -m "Apply reconciled shared snapshot after rebase"
          git push origin HEAD:splitzap-data-hardening
