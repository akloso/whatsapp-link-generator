name: Splitzap Testing Scanner

on:
  push:
    branches: [testing]
    paths:
      - .github/workflows/splitzap-testing-scanner.yml

permissions:
  contents: write

jobs:
  scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing
          fetch-depth: 0

      - name: Apply scanner patch
        run: python3 .github/splitzap_scanner_patch.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Tesseract.js
        run: npm install tesseract.js@^7.0.0 --save

      - name: TypeScript check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Commit scanner
        run: |
          git config user.name "Splitzap Enhancement"
          git config user.email "actions@users.noreply.github.com"
          git add src/features/splitzap/SplitzapAppV4.tsx src/features/splitzap/splitStoreV4.ts package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add browser-only Splitzap bill scanner"
            git push origin HEAD:testing
          fi
