name: Splitzap Testing Net Share Patch

on:
  push:
    branches: [testing]
    paths:
      - .github/workflows/splitzap-testing-net-share-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing
          fetch-depth: 0
      - name: Patch co-payer remaining amount display
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/features/splitzap/SplitzapAppV4.tsx')
          text = path.read_text()

          old = "const sharedOwed = mode === 'exact' ? value : mode === 'percentage' ? sharedTotal * value / 100 : weightTotal ? sharedTotal * value / weightTotal : 0; const savedLabel = splitLabels[member.id]?.trim() ?? '';"
          new = "const sharedOwed = mode === 'exact' ? value : mode === 'percentage' ? sharedTotal * value / 100 : weightTotal ? sharedTotal * value / weightTotal : 0; const coPayerPaid = multiPayer && member.id !== paidBy ? Math.max(0, Number(payments[member.id]) || 0) : 0; const responsibility = sharedOwed + personal; const remainingAfterCoPay = responsibility - coPayerPaid; const savedLabel = splitLabels[member.id]?.trim() ?? '';"
          if old not in text:
              raise SystemExit('Expected split calculation marker not found')
          text = text.replace(old, new, 1)

          old_display = "{personal > 0 ? <span className=\"text-[10px] font-bold text-primary\">+ {money(personal, group.currency)} personal</span> : null}</div>{mode === 'equal' ? <><span className=\"tabular text-sm text-muted-foreground\">{value > 0 ? money(sharedOwed + personal, group.currency) : personal > 0 ? money(personal, group.currency) : '—'}</span>"
          new_display = "{personal > 0 ? <span className=\"text-[10px] font-bold text-primary\">+ {money(personal, group.currency)} personal</span> : null}{coPayerPaid > 0 ? <span className={`block text-[10px] font-bold ${remainingAfterCoPay < -0.009 ? 'text-positive' : 'text-muted-foreground'}`}>{money(coPayerPaid, group.currency)} paid · {remainingAfterCoPay > 0.009 ? `${money(remainingAfterCoPay, group.currency)} remaining` : remainingAfterCoPay < -0.009 ? `gets ${money(-remainingAfterCoPay, group.currency)}` : 'covered'}</span> : null}</div>{mode === 'equal' ? <><span className={`tabular text-sm ${coPayerPaid > 0 && remainingAfterCoPay < -0.009 ? 'font-bold text-positive' : 'text-muted-foreground'}`}>{value > 0 ? coPayerPaid > 0 ? remainingAfterCoPay < -0.009 ? `gets ${money(-remainingAfterCoPay, group.currency)}` : money(Math.max(0, remainingAfterCoPay), group.currency) : money(responsibility, group.currency) : personal > 0 ? money(personal, group.currency) : '—'}</span>"
          if old_display not in text:
              raise SystemExit('Expected equal split display marker not found')
          text = text.replace(old_display, new_display, 1)

          path.write_text(text)
      - name: Commit patch
        run: |
          git config user.name "Splitzap Patch"
          git config user.email "actions@users.noreply.github.com"
          git add src/features/splitzap/SplitzapAppV4.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Deduct co-payer payments from displayed split amounts"
          git push origin testing
