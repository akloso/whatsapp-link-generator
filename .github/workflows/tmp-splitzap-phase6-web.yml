name: Temporary Splitzap Phase 6 web patch

on:
  push:
    branches: [splitzap-notifications]
    paths:
      - '.github/workflows/tmp-splitzap-phase6-web.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: splitzap-notifications
      - name: Patch notification registration, preferences and logout safety
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/features/splitzap/SplitzapCloudApp.tsx')
          text = path.read_text()

          import_anchor = """import { compactSnapshotFingerprint, preserveDirtyRemoteRow, preserveDirtySharedGroupsOnBootstrap, type ConfirmedSharedState } from './splitzapSyncSafety';\n"""
          import_add = import_anchor + """import {\n  getSplitzapNotificationPreferences, isSplitzapAndroidApp, listenForNativeNotificationStatus, listenForNativePushToken, readStoredNativePushToken, registerSplitzapPushDevice, requestNativeNotificationPermission, unregisterStoredSplitzapPushDevice, updateSplitzapNotificationPreferences, type SplitzapNotificationPreferences,\n} from './splitzapNotifications';\n"""
          if text.count(import_anchor) != 1: raise SystemExit('notification import anchor mismatch')
          text = text.replace(import_anchor, import_add, 1)

          helper_anchor = """type EmailMode = 'signin' | 'signup';\n\n"""
          helper_add = helper_anchor + """async function signOutSplitzapSafely() {\n  try { await unregisterStoredSplitzapPushDevice(); } catch { /* best effort while the session is still valid */ }\n  await signOutSplitzap();\n}\n\n"""
          if text.count(helper_anchor) != 1: raise SystemExit('helper anchor mismatch')
          text = text.replace(helper_anchor, helper_add, 1)

          auth_effect_end = """    return () => { active = false; unsubscribe(); };\n  }, []);\n\n  useEffect(() => {\n    if (!session || !accountDataReady) { setProfileReady(false); return; }\n"""
          push_effect = """    return () => { active = false; unsubscribe(); };\n  }, []);\n\n  useEffect(() => {\n    if (!session || !accountDataReady || !isSplitzapAndroidApp()) return;\n    let active = true;\n    const register = async (detail: ReturnType<typeof readStoredNativePushToken>) => {\n      if (!active || !detail) return;\n      try { await registerSplitzapPushDevice(detail); } catch { /* retry on the next token event/resume */ }\n    };\n    void register(readStoredNativePushToken());\n    const unsubscribe = listenForNativePushToken((detail) => { void register(detail); });\n    return () => { active = false; unsubscribe(); };\n  }, [accountDataReady, session]);\n\n  useEffect(() => {\n    if (!session || !accountDataReady) { setProfileReady(false); return; }\n"""
          if text.count(auth_effect_end) != 1: raise SystemExit('push effect anchor mismatch')
          text = text.replace(auth_effect_end, push_effect, 1)

          states_anchor = """  const [deleteConfirm, setDeleteConfirm] = useState('');\n  const installState = useSplitzapInstall();\n"""
          states_new = """  const [deleteConfirm, setDeleteConfirm] = useState('');\n  const [notificationPrefs, setNotificationPrefs] = useState<SplitzapNotificationPreferences>({ expenses: true, payments: true, group_activity: true });\n  const [notificationPermission, setNotificationPermission] = useState<'granted' | 'not-granted'>(() => readStoredNativePushToken()?.permission === 'granted' ? 'granted' : 'not-granted');\n  const installState = useSplitzapInstall();\n  const androidApp = isSplitzapAndroidApp();\n"""
          if text.count(states_anchor) != 1: raise SystemExit('profile state anchor mismatch')
          text = text.replace(states_anchor, states_new, 1)

          profile_effect_anchor = """    void getSplitzapPaymentProfile().then((payment) => { setUpiId(payment.upi_id ?? ''); setAllowGroupUpi(Boolean(payment.allow_group_upi)); }).catch(() => { setUpiId(''); setAllowGroupUpi(false); });\n    void refreshDeleted();\n  // eslint-disable-next-line react-hooks/exhaustive-deps\n  }, [open, profile?.display_name, profile?.default_currency, profile?.theme, profile?.reduced_motion]);\n"""
          profile_effect_new = """    void getSplitzapPaymentProfile().then((payment) => { setUpiId(payment.upi_id ?? ''); setAllowGroupUpi(Boolean(payment.allow_group_upi)); }).catch(() => { setUpiId(''); setAllowGroupUpi(false); });\n    void getSplitzapNotificationPreferences().then(setNotificationPrefs).catch(() => setNotificationPrefs({ expenses: true, payments: true, group_activity: true }));\n    setNotificationPermission(readStoredNativePushToken()?.permission === 'granted' ? 'granted' : 'not-granted');\n    void refreshDeleted();\n    const stopStatus = listenForNativeNotificationStatus(setNotificationPermission);\n    const stopToken = listenForNativePushToken((detail) => setNotificationPermission(detail.permission === 'granted' ? 'granted' : 'not-granted'));\n    return () => { stopStatus(); stopToken(); };\n  // eslint-disable-next-line react-hooks/exhaustive-deps\n  }, [open, profile?.display_name, profile?.default_currency, profile?.theme, profile?.reduced_motion]);\n"""
          if text.count(profile_effect_anchor) != 1: raise SystemExit('profile effect anchor mismatch')
          text = text.replace(profile_effect_anchor, profile_effect_new, 1)

          save_anchor = """  const savePaymentProfile = async () => {\n    setBusy(true); setFeedback('');\n    try {\n      await updateSplitzapPaymentProfile(upiId, allowGroupUpi);\n      const refreshed = await getSplitzapPaymentProfile();\n      setUpiId(refreshed.upi_id ?? '');\n      setAllowGroupUpi(Boolean(refreshed.allow_group_upi));\n      setFeedback(refreshed.upi_id ? 'UPI payment settings saved.' : 'UPI ID removed.');\n    } catch (cause) { setFeedback(cause instanceof Error ? cause.message : 'Could not save UPI settings.'); }\n    finally { setBusy(false); }\n  };\n\n"""
          save_new = save_anchor + """  const saveNotificationPreferences = async () => {\n    setBusy(true); setFeedback('');\n    try {\n      const saved = await updateSplitzapNotificationPreferences(notificationPrefs);\n      setNotificationPrefs(saved);\n      setFeedback('Notification preferences saved.');\n    } catch (cause) { setFeedback(cause instanceof Error ? cause.message : 'Could not save notification preferences.'); }\n    finally { setBusy(false); }\n  };\n\n"""
          if text.count(save_anchor) != 1: raise SystemExit('notification save anchor mismatch')
          text = text.replace(save_anchor, save_new, 1)

          remove_anchor = """    try {\n      await deleteSplitzapAccount();\n      clearSplitzapExpenseDraft(session.user.id);\n      try { await signOutSplitzap(); } catch { /* account may already be removed */ }\n"""
          remove_new = """    try {\n      try { await unregisterStoredSplitzapPushDevice(); } catch { /* best effort before account removal */ }\n      await deleteSplitzapAccount();\n      clearSplitzapExpenseDraft(session.user.id);\n      try { await signOutSplitzap(); } catch { /* account may already be removed */ }\n"""
          if text.count(remove_anchor) != 1: raise SystemExit('delete account anchor mismatch')
          text = text.replace(remove_anchor, remove_new, 1)

          prefs_ui_anchor = """      <ProfileSection title=\"Preferences\"><div className=\"grid grid-cols-2 gap-2\"><div><label className=\"block text-[11px] font-bold text-slate-600\">Default currency</label><select value={currency} onChange={(event) => setCurrency(event.target.value)} className=\"mt-1 w-full rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-sm\">{['₹','$','€','£','¥'].map((item) => <option key={item}>{item}</option>)}</select></div><div><label className=\"block text-[11px] font-bold text-slate-600\">Theme</label><select value={theme} onChange={(event) => setTheme(event.target.value as SplitzapProfile['theme'])} className=\"mt-1 w-full rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-sm\"><option value=\"system\">System</option><option value=\"light\">Light</option><option value=\"dark\">Dark</option></select></div></div><label className=\"mt-3 flex items-center justify-between rounded-xl bg-slate-50 px-3 py-3 text-xs font-bold\">Reduced animations<input type=\"checkbox\" checked={reducedMotion} onChange={(event) => setReducedMotion(event.target.checked)} className=\"size-5\" /></label><button type=\"button\" disabled={busy} onClick={() => void savePreferences()} className=\"mt-3 w-full rounded-xl bg-[#e7f4ef] py-3 text-xs font-bold text-[#256f66]\">Save preferences</button></ProfileSection>\n"""
          notify_ui = prefs_ui_anchor + """      <ProfileSection title=\"Notifications\"><div className=\"space-y-2\">{([['expenses','Expenses','New shared expenses'],['payments','Payments','Payments and settlements'],['group_activity','Group activity','People joining or leaving']] as const).map(([key,label,detail]) => <label key={key} className=\"flex items-center gap-3 rounded-xl bg-slate-50 px-3 py-3\"><input type=\"checkbox\" checked={notificationPrefs[key]} onChange={(event) => setNotificationPrefs((current) => ({ ...current, [key]: event.target.checked }))} className=\"size-5 shrink-0\" /><span className=\"min-w-0 flex-1\"><b className=\"block text-xs\">{label}</b><span className=\"block text-[10px] text-slate-500\">{detail}</span></span></label>)}</div><button type=\"button\" disabled={busy} onClick={() => void saveNotificationPreferences()} className=\"mt-3 w-full rounded-xl bg-[#e7f4ef] py-3 text-xs font-bold text-[#256f66] disabled:opacity-40\">Save notifications</button>{androidApp ? <div className=\"mt-2\">{notificationPermission === 'granted' ? <p className=\"rounded-xl bg-emerald-50 px-3 py-2 text-[10px] font-bold text-emerald-700\">Android notifications allowed</p> : <button type=\"button\" onClick={() => { if (!requestNativeNotificationPermission()) setFeedback('Notification permission is available in the Splitzap Android app.'); }} className=\"w-full rounded-xl bg-slate-900 py-3 text-xs font-bold text-white\">Turn on Android notifications</button>}</div> : <p className=\"mt-2 text-[10px] leading-4 text-slate-500\">Push alerts are available in the Splitzap Android app.</p>}</ProfileSection>\n"""
          if text.count(prefs_ui_anchor) != 1: raise SystemExit('notification UI anchor mismatch')
          text = text.replace(prefs_ui_anchor, notify_ui, 1)

          # Replace user-initiated sign-outs, but leave the account-deletion fallback alone.
          text = text.replace('onClick={() => void signOutSplitzap()}', 'onClick={() => void signOutSplitzapSafely()}', 1)
          text = text.replace('void signOutSplitzap().then(onClose);', 'void signOutSplitzapSafely().then(onClose);', 1)
          text = text.replace('void signOutSplitzap(); }} className="w-full rounded-2xl', 'void signOutSplitzapSafely(); }} className="w-full rounded-2xl', 1)

          path.write_text(text)
          PY

          grep -Fq "splitzapNotifications" src/features/splitzap/SplitzapCloudApp.tsx
          grep -Fq "registerSplitzapPushDevice" src/features/splitzap/SplitzapCloudApp.tsx
          grep -Fq 'title="Notifications"' src/features/splitzap/SplitzapCloudApp.tsx
          grep -Fq 'Turn on Android notifications' src/features/splitzap/SplitzapCloudApp.tsx
          grep -Fq 'signOutSplitzapSafely' src/features/splitzap/SplitzapCloudApp.tsx
      - name: Commit Phase 6 web changes
        shell: bash
        run: |
          git config user.name "Splitzap Phase 6 Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/features/splitzap/SplitzapCloudApp.tsx
          git commit -m "Phase 6: add push notification preferences and device registration"
          git push origin HEAD:splitzap-notifications
