name: Splitzap Level 2

on:
  push:
    branches: [testing]
    paths:
      - '.github/splitzap_level2_patch.py'
      - '.github/splitzap_level2_fix.py'
      - '.github/workflows/splitzap-level2.yml'

permissions:
  contents: write

jobs:
  level2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply Level 2 patch
        run: |
          python .github/splitzap_level2_patch.py
          python .github/splitzap_level2_fix.py
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Splitzap tests
        run: npm run test:splitzap
      - name: Production build
        run: npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit Level 2
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/splitzap/SplitzapAppV4.tsx src/features/splitzap/SplitzapCloudApp.tsx src/features/splitzap/splitStoreV4.ts
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Add Splitzap shared group collaboration'
            git push origin testing
          fi
