name: Splitzap Testing Polish

on:
  push:
    branches: [testing]
    paths:
      - .github/workflows/splitzap-testing-polish.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing
          fetch-depth: 0

      - name: Apply polish patch
        run: python3 .github/splitzap_polish_patch.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Commit polish
        run: |
          git config user.name "Splitzap Enhancement"
          git config user.email "actions@users.noreply.github.com"
          git add src/features/splitzap/SplitzapAppV4.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Polish Splitzap validation and advanced expense dialogs"
            git push origin HEAD:testing
          fi
