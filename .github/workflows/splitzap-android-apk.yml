name: Build Splitzap Android APK

on:
  push:
    branches:
      - splitzap-android-apk
    paths:
      - "android-apk/**"
      - ".github/workflows/splitzap-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle -p android-apk :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK="android-apk/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.zapora.splitzap'"
          mkdir -p android-apk/output
          cp "$APK" android-apk/output/Splitzap-Android-debug.apk
          sha256sum android-apk/output/Splitzap-Android-debug.apk | tee android-apk/output/Splitzap-Android-debug.apk.sha256

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: splitzap-android-debug
          path: |
            android-apk/output/Splitzap-Android-debug.apk
            android-apk/output/Splitzap-Android-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
