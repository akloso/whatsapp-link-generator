name: TEMP Splitzap Durable Sync Validator

on:
  pull_request:
    branches: [main]
    paths:
      - '.tmp-splitzap-durable-sync-trigger'

permissions:
  contents: write

jobs:
  patch-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply durable sync hardening
        run: python scripts/tmp_splitzap_durable_sync_patch.py
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Splitzap regression tests
        run: npm run test:splitzap
      - name: Production build
        run: npm run build
      - name: Production dependency security gate
        run: npm audit --omit=dev --audit-level=high
      - name: Durable state assertions
        shell: bash
        run: |
          grep -q "preserveDirtySharedGroupsOnBootstrap" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "compactSnapshotFingerprint" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "SHARED_CONFIRMED_PREFIX" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "restartDirtySharedIds" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "actual server account copy" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "across an app restart" src/features/splitzap/splitzapSyncSafety.test.ts
      - name: Commit validated source
        shell: bash
        run: |
          git config user.name "splitzap-integrity-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .tmp-splitzap-durable-sync-trigger
          git add \
            src/features/splitzap/SplitzapCloudApp.tsx \
            src/features/splitzap/splitzapSyncSafety.ts \
            src/features/splitzap/splitzapSyncSafety.test.ts
          git commit -m "Persist Splitzap dirty sync state across restarts"
          git push origin HEAD:testing
