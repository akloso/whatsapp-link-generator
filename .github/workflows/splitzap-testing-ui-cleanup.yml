name: Splitzap Testing UI Cleanup

on:
  push:
    branches: [testing]
    paths:
      - .github/workflows/splitzap-testing-ui-cleanup.yml

permissions:
  contents: write

jobs:
  ui-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing
          fetch-depth: 0

      - name: Apply UI cleanup patch
        run: python .github/splitzap_ui_cleanup_patch.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: UI assertions
        run: |
          grep -q "suggestExpenseCategory" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "Split equally" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "Some people" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "result-document" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "Splitzap UI calm-density pass" src/features/splitzap/splitzap.css

      - name: Commit UI cleanup
        run: |
          git config user.name "Splitzap Enhancement"
          git config user.email "actions@users.noreply.github.com"
          git add src/features/splitzap/SplitzapAppV4.tsx src/features/splitzap/splitzap.css
          if git diff --cached --quiet; then
            echo "No app changes to commit"
            exit 0
          fi
          git commit -m "Polish Splitzap UI hierarchy and auto expense icons"
          git push origin HEAD:testing
