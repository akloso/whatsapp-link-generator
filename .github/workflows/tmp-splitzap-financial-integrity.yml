name: TEMP Splitzap Financial Integrity Patch

on:
  push:
    branches: [testing]
    paths:
      - 'scripts/tmp_splitzap_financial_integrity_patch.py'
      - '.github/workflows/tmp-splitzap-financial-integrity.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply scoped patch
        run: python scripts/tmp_splitzap_financial_integrity_patch.py
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Splitzap regression tests
        run: npm run test:splitzap
      - name: Production build
        run: npm run build
      - name: Production dependency security gate
        run: npm audit --omit=dev --audit-level=high
      - name: Financial-integrity assertions
        shell: bash
        run: |
          grep -q "splitzap_update_shared_group_v2" src/features/splitzap/splitzapShared.ts
          grep -q "splitzap_get_profile_v2" src/features/splitzap/splitzapProduction.ts
          grep -q "preserveDirtyRemoteRow" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "sharedSyncing" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "personalSettlementBuckets" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "selectedDebt.from !== currentMemberId" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "FirstRunProfileSetup" src/features/splitzap/SplitzapCloudApp.tsx
          ! grep -q '<Field label="Your name"' src/features/splitzap/SplitzapAppV4.tsx
          grep -q "splitzap-v4" public/splitzap-sw.js
      - name: Commit validated Splitzap source only
        shell: bash
        run: |
          git config user.name "splitzap-integrity-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/features/splitzap/SplitzapCloudApp.tsx \
            src/features/splitzap/SplitzapAppV4.tsx \
            src/features/splitzap/splitStoreV4.ts \
            src/features/splitzap/splitStoreV4.test.ts \
            src/features/splitzap/splitzapShared.ts \
            src/features/splitzap/splitzapProduction.ts \
            src/features/splitzap/splitzapSyncSafety.ts \
            src/features/splitzap/splitzapSyncSafety.test.ts \
            package.json \
            .github/workflows/splitzap-readiness.yml
          if git diff --cached --quiet; then
            echo "No validated source changes to commit."
            exit 0
          fi
          git commit -m "Harden Splitzap financial sync and personal settlement access"
          git push origin HEAD:testing
