name: Splitzap Shared Hash Fix

on:
  push:
    branches: [testing]
    paths:
      - '.github/workflows/splitzap-shared-hash-fix.yml'

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply canonical snapshot hash
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/features/splitzap/splitzapShared.ts')
          text = path.read_text()
          old = """export function sharedSnapshotHash(snapshot: SharedGroupSnapshot) {
            return JSON.stringify(snapshot);
          }
          """
          new = """function canonicalizeForHash(value: unknown): unknown {
            if (Array.isArray(value)) return value.map(canonicalizeForHash);
            if (value && typeof value === 'object') {
              const record = value as Record<string, unknown>;
              return Object.fromEntries(
                Object.keys(record).sort().map((key) => [key, canonicalizeForHash(record[key])]),
              );
            }
            return value;
          }

          export function sharedSnapshotHash(snapshot: SharedGroupSnapshot) {
            return JSON.stringify(canonicalizeForHash(snapshot));
          }
          """
          if old not in text:
              raise SystemExit('sharedSnapshotHash target not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Splitzap tests
        run: npm run test:splitzap
      - name: Production build
        run: npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit validated fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/splitzap/splitzapShared.ts
          git commit -m 'Stabilize shared snapshot hashing'
          git push origin testing
