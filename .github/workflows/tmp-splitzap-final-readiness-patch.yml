name: Temporary Splitzap final readiness patch

on:
  push:
    branches: [splitzap-final-integration]
    paths:
      - '.github/workflows/tmp-splitzap-final-readiness-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: splitzap-final-integration
      - name: Add final integration readiness assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/splitzap-readiness.yml')
          text = path.read_text()

          text = text.replace("      - 'public/splitzap*'\n", "      - 'public/splitzap*'\n      - 'public/.well-known/assetlinks.json'\n")

          pwa_anchor = '''          file public/splitzap-icon-512.png | grep -q "PNG image data, 512 x 512"\n'''
          pwa_add = pwa_anchor + '''          test -f public/.well-known/assetlinks.json\n          python - <<'PY2'\n          import json\n          from pathlib import Path\n          data = json.loads(Path('public/.well-known/assetlinks.json').read_text())\n          target = data[0]['target']\n          assert data[0]['relation'] == ['delegate_permission/common.handle_all_urls']\n          assert target['namespace'] == 'android_app'\n          assert target['package_name'] == 'com.zapora.splitzap'\n          assert target['sha256_cert_fingerprints'] == ['44:1E:E1:1B:01:3E:4E:04:CD:C5:AE:CB:F0:DB:43:64:8C:D2:3D:03:6A:F9:35:E3:21:EA:FD:92:20:3F:25:9A']\n          PY2\n'''
          if text.count(pwa_anchor) != 1:
              raise SystemExit('PWA assertion anchor mismatch')
          text = text.replace(pwa_anchor, pwa_add, 1)

          safety_anchor = '''          test -f src/features/splitzap/splitzapPaymentSafety.ts\n'''
          safety_add = safety_anchor + '''          test -f src/features/splitzap/splitzapFinancialIntegrity.ts\n          test -f src/features/splitzap/splitzapEntityConflict.ts\n          test -f src/features/splitzap/splitzapFinancialIntegrity.test.ts\n          test -f src/features/splitzap/splitzapNotifications.ts\n          grep -q "assertSharedSnapshotIntegrity" src/features/splitzap/splitzapShared.ts\n          grep -q "reconcileSharedGroupSnapshots" src/features/splitzap/splitzapShared.ts\n          grep -q "splitzap_register_push_device" src/features/splitzap/splitzapNotifications.ts\n          grep -q "splitzap_update_notification_preferences" src/features/splitzap/splitzapNotifications.ts\n'''
          if text.count(safety_anchor) != 1:
              raise SystemExit('Safety assertion anchor mismatch')
          text = text.replace(safety_anchor, safety_add, 1)

          ux_anchor = '''          grep -q "Import Splitzap backup" src/features/splitzap/SplitzapCloudApp.tsx\n'''
          ux_add = ux_anchor + '''          grep -q 'title="Notifications"' src/features/splitzap/SplitzapCloudApp.tsx\n          grep -q "Turn on Android notifications" src/features/splitzap/SplitzapCloudApp.tsx\n          grep -q "registerSplitzapPushDevice" src/features/splitzap/SplitzapCloudApp.tsx\n          grep -q "signOutSplitzapSafely" src/features/splitzap/SplitzapCloudApp.tsx\n          grep -q "hash.startsWith('#group=')" src/features/splitzap/SplitzapAppV4.tsx\n'''
          if text.count(ux_anchor) != 1:
              raise SystemExit('UX assertion anchor mismatch')
          text = text.replace(ux_anchor, ux_add, 1)

          path.write_text(text)
          PY

          git config user.name "Splitzap Integration Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/splitzap-readiness.yml
          git commit -m "Add final Splitzap readiness assertions"
          git push origin HEAD:splitzap-final-integration
