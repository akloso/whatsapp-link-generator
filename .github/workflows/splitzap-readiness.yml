name: Splitzap Readiness

on:
  push:
    branches: [testing]
    paths:
      - 'scripts/splitzap_product_polish.py'
      - '.github/workflows/splitzap-product-polish.yml'
      - '.github/workflows/splitzap-readiness.yml'
  pull_request:
    paths:
      - 'src/features/splitzap/**'
      - 'src/components/SplitzapPage.tsx'
      - 'src/App.tsx'
      - 'public/splitzap*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/splitzap-readiness.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply, validate and commit approved polish
        shell: bash
        run: |
          set -uo pipefail
          git config user.name "splitzap-production-bot"
          git config user.email "splitzap-production-bot@users.noreply.github.com"

          fail_stage() {
            stage="$1"; code="$2"
            {
              echo "FAILED_STAGE=$stage"
              echo "EXIT_CODE=$code"
              echo "RUN_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo
              cat /tmp/splitzap-stage.log 2>/dev/null || true
            } > .splitzap-polish-error.log
            git add .splitzap-polish-error.log
            git commit -m "Report Splitzap polish validation failure" || true
            git push origin HEAD:testing || true
            exit "$code"
          }

          stage() {
            name="$1"; shift
            echo "===== $name ====="
            set +e
            "$@" > /tmp/splitzap-stage.log 2>&1
            code=$?
            set -e
            cat /tmp/splitzap-stage.log
            [ "$code" -eq 0 ] || fail_stage "$name" "$code"
          }

          set -e
          stage patch bash -lc 'python3 scripts/splitzap_product_polish.py && sed -i "s/, UserRound//" src/features/splitzap/SplitzapCloudApp.tsx'
          stage install npm ci
          stage typecheck npm run typecheck
          stage tests npm run test:splitzap
          stage build npm run build
          stage audit npm audit --omit=dev --audit-level=high
          stage assertions bash -lc '
            set -e
            grep -q "SPLITZAP_SCHEMA_VERSION = 2" src/features/splitzap/splitStoreV4.ts
            grep -q "splitzap_create_invite" src/features/splitzap/splitzapProduction.ts
            grep -q "splitzap_join_v2" src/features/splitzap/splitzapProduction.ts
            grep -q "splitzap_resolve_join_request" src/features/splitzap/splitzapProduction.ts
            grep -q "Sign in to Splitzap" src/features/splitzap/SplitzapCloudApp.tsx
            grep -q "Loading your Splitzap" src/features/splitzap/SplitzapCloudApp.tsx
            ! grep -q "Move this device'"'"'s Splitzap data online" src/features/splitzap/SplitzapCloudApp.tsx
            ! grep -q "Two different Splitzap copies found" src/features/splitzap/SplitzapCloudApp.tsx
            ! grep -qEi "Supabase|2-per-hour test|test sender" src/features/splitzap/SplitzapCloudApp.tsx
            grep -q "Remove from group" src/features/splitzap/SplitzapCloudApp.tsx
            grep -q "Create invite link" src/features/splitzap/SplitzapCloudApp.tsx
            grep -q "Wrong signed-in email" src/features/splitzap/SplitzapCloudApp.tsx
            grep -q "Any already joined group member" src/features/splitzap/SplitzapCloudApp.tsx
            grep -q "Offline · changes saved on this device" src/features/splitzap/SplitzapCloudApp.tsx
            grep -q '"'"'type="date"'"'"' src/features/splitzap/SplitzapAppV4.tsx
            grep -q "Original breakdown" src/features/splitzap/SplitzapAppV4.tsx
            grep -q "Simplified settlement" src/features/splitzap/SplitzapAppV4.tsx
            grep -q "Share group summary" src/features/splitzap/SplitzapAppV4.tsx
            grep -q "Close group menu" src/features/splitzap/SplitzapAppV4.tsx
            grep -q "Scan receipt" src/features/splitzap/SplitzapAppV4.tsx
            ! grep -q "More options" src/features/splitzap/SplitzapAppV4.tsx
            grep -q ">+ label</button>" src/features/splitzap/SplitzapAppV4.tsx
            grep -q "validationMessage" src/features/splitzap/SplitzapAppV4.tsx
            grep -q "sheet-scroll" src/features/splitzap/SplitzapAppV4.tsx
            grep -q "@supports (-webkit-touch-callout: none)" src/features/splitzap/splitzap.css
          '

          rm -f .splitzap-polish-error.log
          rm -f scripts/splitzap_product_polish.py
          rm -f .github/workflows/splitzap-product-polish.yml
          git fetch origin main
          git show origin/main:.github/workflows/splitzap-readiness.yml > .github/workflows/splitzap-readiness.yml
          git add -A
          git commit -m "Polish Splitzap production UX and account safety"
          git push origin HEAD:testing
