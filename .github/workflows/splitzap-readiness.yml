name: Splitzap Readiness

on:
  push:
    branches: [testing]
    paths:
      - 'src/features/splitzap/**'
      - 'src/components/SplitzapPage.tsx'
      - 'src/App.tsx'
      - 'public/splitzap*'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/tmp_splitzap_ui_polish_patch.py'
      - '.github/workflows/splitzap-readiness.yml'
  pull_request:
    paths:
      - 'src/features/splitzap/**'
      - 'src/components/SplitzapPage.tsx'
      - 'src/App.tsx'
      - 'public/splitzap*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/splitzap-readiness.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing
          fetch-depth: 0
      - name: Detect approved UI-only patch
        id: patch
        shell: bash
        run: |
          if [ -f scripts/tmp_splitzap_ui_polish_patch.py ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply minimal-copy visual polish
        if: steps.patch.outputs.run == 'true'
        run: python scripts/tmp_splitzap_ui_polish_patch.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Splitzap regression tests
        run: npm run test:splitzap
      - name: Production build
        run: npm run build
      - name: Production dependency security gate
        run: npm audit --omit=dev --audit-level=high
      - name: Financial and sync-safety assertions
        shell: bash
        run: |
          grep -Fq "preserveDirtyRemoteRow" src/features/splitzap/SplitzapCloudApp.tsx
          grep -Fq "preserveDirtySharedGroupsOnBootstrap" src/features/splitzap/SplitzapCloudApp.tsx
          grep -Fq "SHARED_CONFIRMED_PREFIX" src/features/splitzap/SplitzapCloudApp.tsx
          grep -Fq "restartDirtySharedIds" src/features/splitzap/SplitzapCloudApp.tsx
          grep -Fq "sharedSyncing" src/features/splitzap/SplitzapCloudApp.tsx
          grep -Fq "splitzap.settlementSession" src/features/splitzap/SplitzapAppV4.tsx
          grep -Fq "Did you complete the payment?" src/features/splitzap/SplitzapAppV4.tsx
          grep -Fq "Enter their UPI ID for this payment" src/features/splitzap/SplitzapAppV4.tsx
          ! grep -Fq "Scan UPI QR" src/features/splitzap/SplitzapAppV4.tsx
          ! grep -Fq "BarcodeDetector" src/features/splitzap/SplitzapAppV4.tsx
          grep -Fq "Continue without login" src/features/splitzap/SplitzapCloudApp.tsx
          grep -Fq "splitzap.guest.data.v1" src/features/splitzap/SplitzapCloudApp.tsx
      - name: Minimal-copy and visual assertions
        shell: bash
        run: |
          grep -Fq "Try Splitzap as guest" src/features/splitzap/SplitzapCloudApp.tsx
          grep -Fq "Local only" src/features/splitzap/SplitzapCloudApp.tsx
          grep -Fq "Sign in free for backup + sharing" src/features/splitzap/SplitzapCloudApp.tsx
          grep -Fq "guest-profile-alert" src/features/splitzap/SplitzapCloudApp.tsx
          grep -Fq "balance-card--get" src/features/splitzap/SplitzapAppV4.tsx
          grep -Fq "balance-card--owe" src/features/splitzap/SplitzapAppV4.tsx
          grep -Fq "splitzap-camera-button" src/features/splitzap/SplitzapAppV4.tsx
          grep -Fq "splitzap-new-button" src/features/splitzap/SplitzapAppV4.tsx
          grep -Fq "splitzapGuestNudge" src/features/splitzap/splitzap.css
          grep -Fq "prefers-reduced-motion" src/features/splitzap/splitzap.css
      - name: Verify receipt scanner stayed unchanged by UI pass
        if: steps.patch.outputs.run == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          before = subprocess.check_output(['git', 'show', 'HEAD:src/features/splitzap/SplitzapAppV4.tsx'], text=True)
          after = Path('src/features/splitzap/SplitzapAppV4.tsx').read_text(encoding='utf-8')
          def scanner(text):
              start = text.index('function ReceiptScanner(')
              end = text.index('function PersonalItemsDialog', start)
              return text[start:end]
          if scanner(before) != scanner(after):
              raise SystemExit('Receipt scanner changed unexpectedly')
          print('Receipt scanner unchanged')
          PY
      - name: Commit validated UI source
        if: steps.patch.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name "splitzap-readiness-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -f scripts/tmp_splitzap_ui_polish_patch.py
          git add src/features/splitzap/SplitzapCloudApp.tsx src/features/splitzap/SplitzapAppV4.tsx src/features/splitzap/splitzap.css
          git commit -m "Polish Splitzap colors interactions and guest copy"
          git push origin HEAD:testing
