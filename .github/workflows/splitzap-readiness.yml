name: Splitzap Readiness

on:
  push:
    branches: [testing]
    paths:
      - 'src/features/splitzap/**'
      - 'src/components/SplitzapPage.tsx'
      - 'src/App.tsx'
      - 'public/splitzap*'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/splitzap_runtime_hardening.py'
      - '.github/workflows/splitzap-runtime-hardening.yml'
      - '.github/workflows/splitzap-readiness.yml'
  pull_request:
    paths:
      - 'src/features/splitzap/**'
      - 'src/components/SplitzapPage.tsx'
      - 'src/App.tsx'
      - 'public/splitzap*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/splitzap-readiness.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply approved runtime hardening
        shell: bash
        run: |
          set -o pipefail
          echo apply_patch > /tmp/splitzap-stage
          python3 scripts/splitzap_runtime_hardening.py 2>&1 | tee /tmp/splitzap-validation.log
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          echo npm_ci > /tmp/splitzap-stage
          npm ci 2>&1 | tee /tmp/splitzap-validation.log
      - name: TypeScript
        shell: bash
        run: |
          set -o pipefail
          echo typecheck > /tmp/splitzap-stage
          npm run typecheck 2>&1 | tee /tmp/splitzap-validation.log
      - name: Splitzap calculation tests
        shell: bash
        run: |
          set -o pipefail
          echo splitzap_tests > /tmp/splitzap-stage
          npm run test:splitzap 2>&1 | tee /tmp/splitzap-validation.log
      - name: Production build
        shell: bash
        run: |
          set -o pipefail
          echo production_build > /tmp/splitzap-stage
          npm run build 2>&1 | tee /tmp/splitzap-validation.log
      - name: Production dependency security gate
        shell: bash
        run: |
          set -o pipefail
          echo production_audit > /tmp/splitzap-stage
          npm audit --omit=dev --audit-level=high 2>&1 | tee /tmp/splitzap-validation.log
      - name: PWA asset assertions
        shell: bash
        run: |
          echo pwa_assertions > /tmp/splitzap-stage
          grep -q '"id": "/splitzap"' public/splitzap.webmanifest
          grep -q "splitzap-v3" public/splitzap-sw.js
          test -f public/splitzap-icon-192.png
          test -f public/splitzap-icon-512.png
      - name: Production collaboration and data-safety assertions
        shell: bash
        run: |
          echo collaboration_assertions > /tmp/splitzap-stage
          test -f src/features/splitzap/splitzapShared.ts
          test -f src/features/splitzap/splitzapProduction.ts
          grep -q "SPLITZAP_SCHEMA_VERSION = 2" src/features/splitzap/splitStoreV4.ts
          grep -q "splitzap_update_shared_group" src/features/splitzap/splitzapShared.ts
          grep -q "splitzap_create_invite" src/features/splitzap/splitzapProduction.ts
          grep -q "splitzap_join_v2" src/features/splitzap/splitzapProduction.ts
          grep -q "splitzap_resolve_join_request" src/features/splitzap/splitzapProduction.ts
          grep -q "splitzap_soft_delete_shared_group" src/features/splitzap/splitzapProduction.ts
          grep -q "splitzap_restore_shared_group" src/features/splitzap/splitzapProduction.ts
          grep -q "splitzap_transfer_ownership" src/features/splitzap/splitzapProduction.ts
          grep -q "splitzap_update_profile_name" src/features/splitzap/splitzapProduction.ts
          grep -q "importSplitBackupSafely" src/features/splitzap/SplitzapCloudApp.tsx
      - name: Production UX and account-safety assertions
        shell: bash
        run: |
          echo ux_assertions > /tmp/splitzap-stage
          grep -q "My Profile" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "Sign in to Splitzap" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "Loading your Splitzap" src/features/splitzap/SplitzapCloudApp.tsx
          ! grep -q "Move this device's Splitzap data online" src/features/splitzap/SplitzapCloudApp.tsx
          ! grep -q "Two different Splitzap copies found" src/features/splitzap/SplitzapCloudApp.tsx
          ! grep -qEi "Supabase|2-per-hour test|test sender" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "Remove from group" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "Create invite link" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "Wrong signed-in email" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "Any already joined group member" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "Offline · changes saved on this device" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q 'type="date"' src/features/splitzap/SplitzapAppV4.tsx
          grep -q "Original breakdown" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "Simplified settlement" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "expense_restored" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "Share group summary" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "Close group menu" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "Scan receipt" src/features/splitzap/SplitzapAppV4.tsx
          ! grep -q "More options" src/features/splitzap/SplitzapAppV4.tsx
          grep -q ">+ label</button>" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "validationMessage" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "sheet-scroll" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "availableGroups = data.groups.filter" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "onEdit={isArchived ? undefined" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "expense-confetti" src/features/splitzap/splitzap.css
          grep -q "@supports (-webkit-touch-callout: none)" src/features/splitzap/splitzap.css
      - name: Record validation failure
        if: failure()
        shell: bash
        run: |
          stage=$(cat /tmp/splitzap-stage 2>/dev/null || echo unknown)
          {
            echo "FAILED_STAGE=$stage"
            echo "RUN_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            tail -n 500 /tmp/splitzap-validation.log 2>/dev/null || true
          } > .splitzap-runtime-error.log
          git reset -- . >/dev/null 2>&1 || true
          git config user.name "splitzap-runtime-bot"
          git config user.email "splitzap-runtime-bot@users.noreply.github.com"
          git add .splitzap-runtime-error.log
          git commit -m "Record Splitzap runtime hardening validation failure" || true
          git push origin HEAD:testing
      - name: Commit validated runtime hardening
        if: success()
        shell: bash
        run: |
          git checkout df7400660c79e545808aaf297673c56e9c904526 -- .github/workflows/splitzap-readiness.yml
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/splitzap-readiness.yml')
          text = p.read_text()
          old = '          grep -q "expense-confetti" src/features/splitzap/splitzap.css\n          grep -q "@supports (-webkit-touch-callout: none)" src/features/splitzap/splitzap.css'
          new = old + '''\n          grep -q "clearPendingJoinIntent" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "preview.already_joined" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "Token refresh / same-account auth events" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "Install Splitzap" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "Settle related balance" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "current simplified transfer as paid" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "splitzap-main-scroll" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "splitzap.expenseDraft" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "fixed-shell and mobile touch hardening" src/features/splitzap/splitzap.css
          grep -q "persistSession: true" src/features/splitzap/splitzapCloud.ts
          grep -q "autoRefreshToken: true" src/features/splitzap/splitzapCloud.ts'''
          if old not in text:
              raise SystemExit('Could not restore final readiness assertions')
          p.write_text(text.replace(old, new, 1))
          PY
          rm -f .splitzap-runtime-error.log
          rm -f scripts/splitzap_runtime_hardening.py
          rm -f .github/workflows/splitzap-runtime-hardening.yml
          git config user.name "splitzap-runtime-bot"
          git config user.email "splitzap-runtime-bot@users.noreply.github.com"
          git add -A
          git commit -m "Harden Splitzap runtime continuity and settlement UX"
          git push origin HEAD:testing
