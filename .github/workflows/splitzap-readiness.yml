name: Splitzap Readiness

on:
  push:
    branches: [testing]
    paths:
      - 'src/features/splitzap/**'
      - 'src/components/SplitzapPage.tsx'
      - 'src/App.tsx'
      - 'public/splitzap*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/splitzap-readiness.yml'
  pull_request:
    paths:
      - 'src/features/splitzap/**'
      - 'src/components/SplitzapPage.tsx'
      - 'src/App.tsx'
      - 'public/splitzap*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/splitzap-readiness.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Splitzap calculation and sync-safety tests
        run: npm run test:splitzap
      - name: Production build
        run: npm run build
      - name: Production dependency security gate
        run: npm audit --omit=dev --audit-level=high
      - name: PWA asset assertions
        shell: bash
        run: |
          grep -q '"id": "/splitzap"' public/splitzap.webmanifest
          grep -q "splitzap-v4" public/splitzap-sw.js
          test -f public/splitzap-icon-192.png
          test -f public/splitzap-icon-512.png
          file public/splitzap-icon-192.png | grep -q "PNG image data, 192 x 192"
          file public/splitzap-icon-512.png | grep -q "PNG image data, 512 x 512"
      - name: Production collaboration and data-safety assertions
        shell: bash
        run: |
          test -f src/features/splitzap/splitzapShared.ts
          test -f src/features/splitzap/splitzapProduction.ts
          test -f src/features/splitzap/splitzapSyncSafety.ts
          test -f src/features/splitzap/splitzapSyncSafety.test.ts
          test -f src/features/splitzap/splitzapPaymentSafety.ts
          test ! -f scripts/tmp_splitzap_durable_sync_patch.py
          test ! -f .github/workflows/tmp-splitzap-durable-sync.yml
          test ! -f scripts/tmp_splitzap_ux_patch.py
          test ! -f .github/workflows/tmp-splitzap-ux.yml
          test ! -f .github/workflows/tmp-splitzap-ux-v2.yml
          test ! -f .tmp-splitzap-ux-trigger
          test ! -f .tmp-splitzap-ux-v2-trigger
          grep -q "SPLITZAP_SCHEMA_VERSION = 2" src/features/splitzap/splitStoreV4.ts
          grep -q "splitzap_update_shared_group_v2" src/features/splitzap/splitzapShared.ts
          grep -q "splitzap_get_profile_v2" src/features/splitzap/splitzapProduction.ts
          grep -q "splitzap_create_invite" src/features/splitzap/splitzapProduction.ts
          grep -q "splitzap_join_v2" src/features/splitzap/splitzapProduction.ts
          grep -q "splitzap_resolve_join_request" src/features/splitzap/splitzapProduction.ts
          grep -q "splitzap_soft_delete_shared_group" src/features/splitzap/splitzapProduction.ts
          grep -q "splitzap_restore_shared_group" src/features/splitzap/splitzapProduction.ts
          grep -q "splitzap_transfer_ownership" src/features/splitzap/splitzapProduction.ts
          grep -q "splitzap_update_profile_name" src/features/splitzap/splitzapProduction.ts
          grep -q "importSplitBackupSafely" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "splitzap_get_payment_profile" src/features/splitzap/splitzapProduction.ts
          grep -q "splitzap_update_payment_profile" src/features/splitzap/splitzapProduction.ts
          grep -q "splitzap_get_group_member_upi" src/features/splitzap/splitzapProduction.ts
          grep -q "splitzap_parse_receipt_text" src/features/splitzap/splitzapProduction.ts
          grep -q "preserveDirtyRemoteRow" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "preserveDirtySharedGroupsOnBootstrap" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "compactSnapshotFingerprint" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "SHARED_CONFIRMED_PREFIX" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "restartDirtySharedIds" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "across an app restart" src/features/splitzap/splitzapSyncSafety.test.ts
          grep -q "sharedSyncing" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "setSyncTick" src/features/splitzap/SplitzapCloudApp.tsx
          ! grep -Fq "[accountDataReady, data, session, status, update]" src/features/splitzap/SplitzapCloudApp.tsx
          ! grep -Fq "[accountDataReady, productionTick, session, status, update]" src/features/splitzap/SplitzapCloudApp.tsx
      - name: Production UX and account-safety assertions
        shell: bash
        run: |
          grep -q "My Profile" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "Sign in to Splitzap" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "Loading your Splitzap" src/features/splitzap/SplitzapCloudApp.tsx
          ! grep -q "Move this device's Splitzap data online" src/features/splitzap/SplitzapCloudApp.tsx
          ! grep -q "Two different Splitzap copies found" src/features/splitzap/SplitzapCloudApp.tsx
          ! grep -qEi "Supabase|2-per-hour test|test sender" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "Remove from group" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "Create invite link" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "Wrong signed-in email" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "Any already joined group member" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "Offline · changes saved on this device" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q 'type="date"' src/features/splitzap/SplitzapAppV4.tsx
          grep -q "Original breakdown" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "Simplified settlement" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "expense_restored" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "Share group summary" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "Close group menu" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "Scan receipt" src/features/splitzap/SplitzapAppV4.tsx
          ! grep -q "More options" src/features/splitzap/SplitzapAppV4.tsx
          grep -q ">+ label</button>" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "validationMessage" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "sheet-scroll" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "availableGroups = data.groups.filter" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "onEdit={isArchived ? undefined" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "expense-confetti" src/features/splitzap/splitzap.css
          grep -q "@supports (-webkit-touch-callout: none)" src/features/splitzap/splitzap.css
          grep -q "clearPendingJoinIntent" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "preview.already_joined" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "Token refresh / same-account auth events" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "Install Splitzap" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "Settle related balance" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "current simplified transfer as paid" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "splitzap-main-scroll" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "splitzap.expenseDraft" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "fixed-shell and mobile touch hardening" src/features/splitzap/splitzap.css
          grep -q "persistSession: true" src/features/splitzap/splitzapCloud.ts
          grep -q "autoRefreshToken: true" src/features/splitzap/splitzapCloud.ts
          grep -q "Allow group members to pay me via UPI" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "It is not shown as public profile information" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "onGetMemberUpi" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "Pay with UPI" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "upi://pay" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "Did you complete the payment?" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "paymentMode === 'partial'" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "memberIds?: string\[\]" src/features/splitzap/splitStoreV4.ts
          grep -q "Same as previous" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "Receipt total matched" src/features/splitzap/SplitzapAppV4.tsx
          ! grep -q "function parseReceiptText" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "FirstRunProfileSetup" src/features/splitzap/SplitzapCloudApp.tsx
          ! grep -q '<Field label="Your name"' src/features/splitzap/SplitzapAppV4.tsx
          grep -q "personalSettlementBuckets" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "View only" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "HomeBalanceSheet" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "View details" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "Note (optional)" src/features/splitzap/SplitzapAppV4.tsx
          grep -q ">Undo</button>" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "splitzap.upiPending" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "Scan UPI QR" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "has not shared a UPI ID" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "Mark received" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "balance kept visible" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "note?: string" src/features/splitzap/splitStoreV4.ts
          grep -q "apple-mobile-web-app-title" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "splitzap-home-center" src/features/splitzap/splitzap.css
          grep -q "sheet-panel--tall" src/features/splitzap/splitzap.css
          grep -q "window.history.replaceState({}, '', '/splitzap')" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "fixed left-1/2 top-" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "Splitzap — Split bills, not bonds" src/App.tsx
          grep -q "settlementAuthority" src/features/splitzap/splitzapPaymentSafety.ts
          grep -q "upiIdFromQrValue" src/features/splitzap/splitzapPaymentSafety.ts
