name: Splitzap Readiness

on:
  push:
    branches: [testing]
    paths:
      - 'src/features/splitzap/**'
      - 'src/components/SplitzapPage.tsx'
      - 'src/App.tsx'
      - 'public/splitzap*'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/tmp_splitzap_guest_ios_patch.py'
      - '.github/workflows/splitzap-readiness.yml'
  pull_request:
    paths:
      - 'src/features/splitzap/**'
      - 'src/components/SplitzapPage.tsx'
      - 'src/App.tsx'
      - 'public/splitzap*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/splitzap-readiness.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing
          fetch-depth: 0
      - name: Detect approved one-shot patch
        id: patch
        shell: bash
        run: |
          if [ -f scripts/tmp_splitzap_guest_ios_patch.py ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply approved guest/iOS/settlement patch
        if: steps.patch.outputs.run == 'true'
        run: python scripts/tmp_splitzap_guest_ios_patch.py
      - name: Tighten authenticated branch narrowing
        if: steps.patch.outputs.run == 'true'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/features/splitzap/SplitzapCloudApp.tsx')
          text = path.read_text(encoding='utf-8')
          marker = '''  if (!accountDataReady) {\n'''
          if '  if (!session) return null;\n  if (!accountDataReady) {' not in text:
              if text.count(marker) != 1:
                  raise SystemExit(f'Authenticated branch marker count: {text.count(marker)}')
              text = text.replace(marker, '  if (!session) return null;\n' + marker, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Splitzap calculation and sync-safety tests
        run: npm run test:splitzap
      - name: Production build
        run: npm run build
      - name: Production dependency security gate
        run: npm audit --omit=dev --audit-level=high
      - name: PWA and financial integrity assertions
        shell: bash
        run: |
          grep -q '"id": "/splitzap"' public/splitzap.webmanifest
          grep -q "splitzap-v4" public/splitzap-sw.js
          file public/splitzap-icon-192.png | grep -q "PNG image data, 192 x 192"
          file public/splitzap-icon-512.png | grep -q "PNG image data, 512 x 512"
          grep -q "preserveDirtyRemoteRow" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "preserveDirtySharedGroupsOnBootstrap" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "SHARED_CONFIRMED_PREFIX" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "restartDirtySharedIds" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "sharedSyncing" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "setSyncTick" src/features/splitzap/SplitzapCloudApp.tsx
          ! grep -Fq "[accountDataReady, data, session, status, update]" src/features/splitzap/SplitzapCloudApp.tsx
          ! grep -Fq "[accountDataReady, productionTick, session, status, update]" src/features/splitzap/SplitzapCloudApp.tsx
      - name: Guest, iOS and settlement assertions
        shell: bash
        run: |
          grep -q "createPortal" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "z-\[220\]" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "sticky bottom-0" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "100svh" src/features/splitzap/splitzap.css
          grep -q "splitzap.settlementSession" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "readPendingSettlementSession" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "savePendingSettlementSession" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "Did you complete the payment?" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "Enter their UPI ID for this payment" src/features/splitzap/SplitzapAppV4.tsx
          ! grep -q "Scan UPI QR" src/features/splitzap/SplitzapAppV4.tsx
          ! grep -q "BarcodeDetector" src/features/splitzap/SplitzapAppV4.tsx
          ! grep -q "upiIdFromQrValue" src/features/splitzap/splitzapPaymentSafety.ts
          grep -q "Continue without login" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "Guest mode is local only" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "splitzap.guest.data.v1" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "guestAccountAction" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "Data is kept only on this device" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "onInviteGroup: () => setAccountOpen(true)" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "onJoinGroup: () => setAccountOpen(true)" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "accepts valid manual UPI IDs" src/features/splitzap/splitzapSyncSafety.test.ts
          ! grep -q "extracts the payee from a UPI QR payload" src/features/splitzap/splitzapSyncSafety.test.ts
          grep -q "FirstRunProfileSetup" src/features/splitzap/SplitzapCloudApp.tsx
          grep -q "personalSettlementBuckets" src/features/splitzap/SplitzapAppV4.tsx
          grep -q ">Undo</button>" src/features/splitzap/SplitzapAppV4.tsx
          grep -q "Note (optional)" src/features/splitzap/SplitzapAppV4.tsx
      - name: Verify receipt scanner stayed unchanged
        if: steps.patch.outputs.run == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          before = subprocess.check_output(['git', 'show', 'HEAD:src/features/splitzap/SplitzapAppV4.tsx'], text=True)
          after = Path('src/features/splitzap/SplitzapAppV4.tsx').read_text(encoding='utf-8')
          def scanner(text):
              start = text.index('function ReceiptScanner(')
              end = text.index('function PersonalItemsDialog', start)
              return text[start:end]
          if scanner(before) != scanner(after):
              raise SystemExit('Receipt scanner changed unexpectedly')
          print('Receipt scanner unchanged')
          PY
      - name: Commit validated permanent source
        if: steps.patch.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name "splitzap-readiness-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -f scripts/tmp_splitzap_guest_ios_patch.py
          git add \
            src/features/splitzap/SplitzapAppV4.tsx \
            src/features/splitzap/SplitzapCloudApp.tsx \
            src/features/splitzap/splitzapPaymentSafety.ts \
            src/features/splitzap/splitzapSyncSafety.test.ts \
            src/features/splitzap/splitzap.css
          git commit -m "Add Splitzap guest mode and harden iOS settlement UX"
          git push origin HEAD:testing
