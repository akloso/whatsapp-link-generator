name: Splitzap Auth Upgrade

on:
  push:
    branches: [testing]
    paths:
      - '.github/workflows/splitzap-auth-upgrade.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply auth upgrade
        run: python .github/splitzap_auth_upgrade.py
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Splitzap tests
        run: npm run test:splitzap
      - name: Production build
        run: npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit auth upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/splitzap/SplitzapCloudApp.tsx src/features/splitzap/splitzapCloud.ts src/features/splitzap/SplitzapAppV4.tsx
          git commit -m "Upgrade Splitzap account sign-in UX" || exit 0
          git push origin testing
