<script>
(async function () {
  var paths = [
    '/splitzap-v3-assets/chunk-00.txt',
    '/splitzap-v3-assets/chunk-01.txt',
    '/splitzap-v3-assets/chunk-02.txt',
    '/splitzap-v3-assets/chunk-03.txt',
    '/splitzap-v3-assets/chunk-04.txt',
    '/splitzap-v3-assets/chunk-05.txt',
    '/splitzap-v3-assets/chunk-06.txt',
    '/splitzap-v3-assets/chunk-07.txt',
    '/splitzap-v3-assets/chunk-08.txt'
  ];

  var chunks = await Promise.all(paths.map(async function (path) {
    var response = await fetch(path, { cache: 'no-store' });
    if (!response.ok) throw new Error(path + ' failed with status ' + response.status);
    return response.text();
  }));

  var binary = atob(chunks.join(''));
  var bytes = new Uint8Array(binary.length);
  for (var i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
  var html = new TextDecoder('utf-8').decode(bytes);

  var appShellJs = `
<script id="splitzap-native-shell-script">
(function(){
  if (window.innerWidth > 768) return;

  function haptic(){ try { if (navigator.vibrate) navigator.vibrate(14); } catch(e){} }
  function invoke(name){
    haptic();
    if (window.App && typeof window.App[name] === 'function') window.App[name]();
  }

  function installShell(){
    if (!document.getElementById('sz-native-bar')) {
      var bar = document.createElement('header');
      bar.id = 'sz-native-bar';
      bar.innerHTML = '<div class="sz-native-left"><button class="sz-native-back" aria-label="Back to Zapora">‹</button><div class="sz-native-mark">S</div><div class="sz-native-copy"><b>Splitzap</b><span>Shared expenses</span></div></div><button class="sz-native-add" aria-label="Add expense">+</button>';
      document.body.appendChild(bar);
      bar.querySelector('.sz-native-back').addEventListener('click', function(){ haptic(); window.parent.location.href = '/'; });
      bar.querySelector('.sz-native-add').addEventListener('click', function(){ invoke('openExpense'); });
    }

    if (!document.getElementById('sz-fab')) {
      var fab = document.createElement('button');
      fab.id = 'sz-fab';
      fab.setAttribute('aria-label','Add expense');
      fab.textContent = '+';
      fab.addEventListener('click', function(){ invoke('openExpense'); });
      document.body.appendChild(fab);
    }
  }

  function cleanHome(){
    var app = document.querySelector('.app');
    if (!app) return;
    var heads = app.querySelectorAll('.sectionHead h3, .head h3');
    heads.forEach(function(head){
      if ((head.textContent || '').trim().toLowerCase() === 'quick actions') {
        var card = head.closest('.card');
        if (card) card.style.display = 'none';
      }
    });
  }

  function animateScreen(){
    var app = document.querySelector('.app');
    if (!app) return;
    app.classList.remove('sz-screen-enter');
    void app.offsetWidth;
    app.classList.add('sz-screen-enter');
    cleanHome();
  }

  function installNavigationHistory(){
    document.addEventListener('click', function(event){
      var button = event.target.closest('.navBtn, .nav button');
      if (!button) return;
      var label = (button.textContent || '').trim().toLowerCase();
      if (!label) return;
      var tab = label.indexOf('activity') >= 0 ? 'activity' : label.indexOf('groups') >= 0 ? 'groups' : label.indexOf('home') >= 0 ? 'home' : '';
      if (!tab) return;
      var next = '#splitzap-' + tab;
      if (location.hash !== next) history.pushState({splitzapTab:tab},'',next);
      setTimeout(animateScreen,0);
    }, true);

    window.addEventListener('popstate', function(event){
      var tab = event.state && event.state.splitzapTab;
      if (!tab && location.hash.indexOf('#splitzap-') === 0) tab = location.hash.replace('#splitzap-','');
      if (!tab) return;
      var buttons = Array.prototype.slice.call(document.querySelectorAll('.navBtn, .nav button'));
      var target = buttons.find(function(btn){ return (btn.textContent || '').trim().toLowerCase().indexOf(tab) >= 0; });
      if (target) target.click();
    });
  }

  function installKeyboardAwareness(){
    if (!window.visualViewport) return;
    var update = function(){
      var keyboardOpen = window.innerHeight - window.visualViewport.height > 150;
      document.body.classList.toggle('sz-keyboard-open', keyboardOpen);
    };
    window.visualViewport.addEventListener('resize', update);
    window.visualViewport.addEventListener('scroll', update);
    update();
  }

  function installTouchFeedback(){
    document.addEventListener('click', function(event){
      if (event.target.closest('button, [role="button"]')) haptic();
    }, true);
  }

  installShell();
  installNavigationHistory();
  installKeyboardAwareness();
  installTouchFeedback();
  cleanHome();

  var root = document.querySelector('.app');
  if (root) {
    var observer = new MutationObserver(function(){
      installShell();
      cleanHome();
    });
    observer.observe(root,{childList:true,subtree:false});
  }
})();
<\/script>`;

  html = html.replace('</head>', appShellCss + '</head>');

  document.open();
  document.write(html);
  document.close();
})().catch(function (error) {
  document.body.innerHTML = '<div style="font-family:system-ui;padding:32px;text-align:center"><strong>Splitzap could not load.</strong><p style="color:#64748b">Refresh the page and try again.</p></div>';
  console.error(error);
});
</script>
