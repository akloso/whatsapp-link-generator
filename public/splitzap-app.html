<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>Splitzap</title>
</head>
<body>
<script>
(async function () {
  var paths = [
    '/splitzap-v3-assets/chunk-00.txt',
    '/splitzap-v3-assets/chunk-01.txt',
    '/splitzap-v3-assets/chunk-02.txt',
    '/splitzap-v3-assets/chunk-03.txt',
    '/splitzap-v3-assets/chunk-04.txt',
    '/splitzap-v3-assets/chunk-05.txt',
    '/splitzap-v3-assets/chunk-06.txt',
    '/splitzap-v3-assets/chunk-07.txt',
    '/splitzap-v3-assets/chunk-08.txt'
  ];

  var chunks = await Promise.all(paths.map(async function (path) {
    var response = await fetch(path, { cache: 'no-store' });
    if (!response.ok) {
      throw new Error(path + ' failed with status ' + response.status);
    }
    return response.text();
  }));

  var binary = atob(chunks.join(''));
  var bytes = new Uint8Array(binary.length);
  for (var i = 0; i < binary.length; i += 1) {
    bytes[i] = binary.charCodeAt(i);
  }

  var html = new TextDecoder('utf-8').decode(bytes);
  document.open();
  document.write(html);
  document.close();
})().catch(function (error) {
  document.body.innerHTML = '<div style="font-family:system-ui;padding:24px;text-align:center"><strong>Splitzap could not load.</strong><p style="color:#64748b">Refresh the page and try again.</p></div>';
  console.error(error);
});
</script>
</body>
</html>
