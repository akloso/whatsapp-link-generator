<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Splitzap</title>
<style>
:root{--ink:#0f172a;--muted:#64748b;--line:rgba(15,23,42,.09);--teal:#0f766e;--mint:#14b8a6;--blue:#2563eb;--violet:#7c3aed;--pink:#db2777;--red:#dc2626;--green:#16a34a;--bg:#f4fbff;--card:rgba(255,255,255,.84);--shadow:0 16px 42px rgba(15,23,42,.1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 0 0,rgba(20,184,166,.18),transparent 28%),radial-gradient(circle at 100% 8%,rgba(124,58,237,.14),transparent 26%),radial-gradient(circle at 50% 100%,rgba(37,99,235,.12),transparent 34%),linear-gradient(180deg,#fbfdff,var(--bg));overflow-x:hidden}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{width:min(100%,560px);margin:auto;min-height:100vh;padding:14px 14px calc(104px + env(safe-area-inset-bottom))}.top{position:sticky;top:0;z-index:20;margin:-14px -14px 14px;padding:14px;background:linear-gradient(180deg,rgba(244,251,255,.98),rgba(244,251,255,.76));backdrop-filter:blur(18px);border-bottom:1px solid rgba(15,23,42,.04)}.row{display:flex;align-items:center}.between{justify-content:space-between}.gap8{gap:8px}.gap10{gap:10px}.logo{width:48px;height:48px;border-radius:18px;display:grid;place-items:center;color:#fff;font-weight:950;font-size:21px;background:linear-gradient(135deg,var(--teal),var(--mint) 58%,#67e8f9);box-shadow:0 16px 28px rgba(15,118,110,.24);position:relative;overflow:hidden}.logo:after{content:"";position:absolute;inset:-60%;background:linear-gradient(110deg,transparent,rgba(255,255,255,.3),transparent);transform:rotate(22deg);animation:shine 4s ease-in-out infinite}@keyframes shine{0%,62%{translate:-80% 0}100%{translate:80% 0}}.brand h1{margin:0;font-size:20px;line-height:1;letter-spacing:-.04em}.brand p{margin:4px 0 0;color:var(--muted);font-size:12px}.icon{width:42px;height:42px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.84);color:var(--teal);box-shadow:0 9px 24px rgba(15,23,42,.08);font-size:19px;font-weight:950}.hero{position:relative;overflow:hidden;border-radius:32px;padding:18px;color:#fff;background:linear-gradient(145deg,#0f766e,#14b8a6 58%,#2563eb);box-shadow:0 24px 58px rgba(15,118,110,.23);animation:rise .28s ease}.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.13)}.hero:before{width:170px;height:170px;right:-58px;top:-62px}.hero:after{width:90px;height:90px;right:88px;bottom:-38px}.hero h2{margin:0;font-size:29px;line-height:1.02;letter-spacing:-.07em}.hero p{margin:8px 0 0;font-size:13px;color:rgba(255,255,255,.84)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}.action{border:0;border-radius:24px;padding:17px 14px;text-align:left;color:#fff;position:relative;overflow:hidden;box-shadow:0 13px 30px rgba(15,23,42,.14);transition:.16s}.action:active{transform:scale(.985)}.action.primary{background:linear-gradient(135deg,#0f766e,#14b8a6)}.action.secondary{background:linear-gradient(135deg,#4f46e5,#7c3aed)}.action .e{font-size:23px;display:block;margin-bottom:8px}.action b{display:block;font-size:16px;letter-spacing:-.03em}.action small{display:block;margin-top:4px;color:rgba(255,255,255,.8)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}.stat{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.14);border-radius:18px;padding:11px 9px}.stat b{display:block;font-size:17px;letter-spacing:-.04em}.stat span{display:block;margin-top:4px;font-size:10px;font-weight:850;color:rgba(255,255,255,.76);text-transform:uppercase;letter-spacing:.08em}.card{margin-top:12px;padding:16px;border-radius:28px;background:var(--card);border:1px solid rgba(255,255,255,.66);backdrop-filter:blur(18px);box-shadow:var(--shadow);animation:rise .25s ease}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.head h3{margin:0;font-size:16px;letter-spacing:-.04em}.head span{font-size:12px;color:var(--muted);font-weight:850}.btn,.ghost,.soft,.danger,.whatsapp{border:0;border-radius:18px;padding:14px 15px;font-weight:950;transition:.16s}.btn{color:#fff;background:linear-gradient(135deg,var(--teal),var(--mint));box-shadow:0 14px 28px rgba(15,118,110,.2)}.ghost{color:#334155;background:rgba(255,255,255,.88);border:1px solid var(--line)}.soft{color:var(--teal);background:rgba(20,184,166,.1);border:1px solid rgba(20,184,166,.16)}.danger{color:#fff;background:linear-gradient(135deg,#dc2626,#ef4444)}.whatsapp{color:#fff;background:linear-gradient(135deg,#16a34a,#22c55e);box-shadow:0 14px 28px rgba(22,163,74,.2)}.btn:active,.ghost:active,.soft:active,.danger:active,.whatsapp:active{transform:scale(.988)}.full{width:100%}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.list{display:grid;gap:10px}.item{display:flex;align-items:center;gap:11px;padding:13px;border:1px solid var(--line);border-radius:22px;background:rgba(255,255,255,.85);box-shadow:0 9px 24px rgba(15,23,42,.07)}.itemIcon{width:44px;height:44px;flex:0 0 auto;border-radius:16px;display:grid;place-items:center;color:#fff;font-size:19px;background:linear-gradient(135deg,var(--mint),var(--blue));box-shadow:0 10px 20px rgba(15,23,42,.12)}.itemBody{min-width:0;flex:1}.itemBody b{display:block;font-size:15px;letter-spacing:-.025em}.itemBody span{display:block;margin-top:4px;color:var(--muted);font-size:12px;line-height:1.35}.amount{font-size:17px;font-weight:950;white-space:nowrap}.tinyRow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.tiny{border:1px solid var(--line);background:#fff;color:#334155;border-radius:13px;padding:7px 9px;font-size:11px;font-weight:950}.empty{text-align:center;padding:24px 12px;color:var(--muted)}.empty i{width:60px;height:60px;border-radius:22px;display:grid;place-items:center;margin:0 auto 10px;background:linear-gradient(135deg,rgba(20,184,166,.11),rgba(37,99,235,.08));font-style:normal;font-size:26px}.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}.summary{border-radius:27px;padding:16px;color:#fff;background:linear-gradient(135deg,#111827,#0f766e 62%,#14b8a6);box-shadow:0 20px 44px rgba(15,23,42,.2)}.summary h3{margin:0;font-size:22px;letter-spacing:-.05em}.summary p{margin:6px 0 0;color:rgba(255,255,255,.78);font-size:13px}.bottom{position:fixed;left:50%;bottom:0;translate:-50% 0;z-index:30;width:min(100%,560px);padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(244,251,255,.03),rgba(244,251,255,.95) 34%,#f4fbff);backdrop-filter:blur(18px)}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px;border:1px solid rgba(15,23,42,.06);border-radius:24px;background:rgba(255,255,255,.78);box-shadow:0 11px 30px rgba(15,23,42,.1)}.nav button{border:0;border-radius:18px;padding:11px 7px;background:transparent;color:var(--muted);display:grid;place-items:center;gap:3px;font-size:11px;font-weight:900}.nav button i{font-style:normal;font-size:18px}.nav button.active{color:#fff;background:linear-gradient(135deg,var(--teal),var(--mint));box-shadow:0 11px 22px rgba(15,118,110,.2)}.overlay{position:fixed;inset:0;z-index:70;display:none;align-items:flex-end;background:rgba(15,23,42,.52);backdrop-filter:blur(7px)}.overlay.show{display:flex}.sheet{width:min(100%,560px);max-height:92vh;overflow:auto;margin:auto auto 0;border-radius:30px 30px 0 0;background:#f7fbff;box-shadow:0 -26px 60px rgba(15,23,42,.28);animation:sheet .2s ease}.sheetHead{position:sticky;top:0;z-index:2;padding:15px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(247,251,255,.94);backdrop-filter:blur(15px);border-bottom:1px solid rgba(15,23,42,.06)}.sheetHead h3{margin:0;font-size:18px;letter-spacing:-.04em}.sheetBody{padding:16px}.field{display:grid;gap:7px;margin-bottom:12px}.field label{font-size:12px;color:#475569;font-weight:950}input,select,textarea{width:100%;border:1px solid rgba(15,23,42,.11);border-radius:18px;padding:14px;background:rgba(255,255,255,.86);color:var(--ink);outline:none}textarea{min-height:78px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:rgba(20,184,166,.65);box-shadow:0 0 0 4px rgba(20,184,166,.12);background:#fff}.people{display:grid;gap:8px}.person{display:grid;grid-template-columns:1fr auto;gap:9px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.86)}.personMain{display:flex;align-items:center;gap:9px;min-width:0}.avatar{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:950;background:linear-gradient(135deg,var(--blue),var(--violet))}.personMain input{padding:0;border:0;background:transparent;box-shadow:none;font-weight:900}.payer{border:0;border-radius:999px;padding:8px 10px;background:#edf4ff;color:#475569;font-size:11px;font-weight:950}.payer.active{background:rgba(20,184,166,.14);color:var(--teal)}.remove{border:0;background:transparent;color:var(--red);font-size:18px;font-weight:950}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{display:inline-flex;align-items:center;gap:7px;padding:9px 11px;border-radius:999px;background:#edf4ff;color:#334155;font-size:12px;font-weight:900}.chip button{border:0;background:transparent;color:var(--red);font-weight:950}.notice{padding:12px;border-radius:19px;background:rgba(20,184,166,.08);border:1px dashed rgba(15,118,110,.22);color:var(--teal);font-size:12px;font-weight:850;margin-bottom:12px}.preview{white-space:pre-wrap;padding:14px;border-radius:20px;background:rgba(240,253,250,.82);border:1px dashed rgba(15,118,110,.22);color:#334155;font-size:13px;line-height:1.45}.toast{position:fixed;left:50%;bottom:96px;translate:-50% 0;z-index:90;padding:12px 15px;border-radius:999px;background:#0f172a;color:#fff;font-size:13px;font-weight:950;box-shadow:0 16px 34px rgba(15,23,42,.26);opacity:0;pointer-events:none;transform:translateY(10px);transition:.2s}.toast.show{opacity:1;transform:translateY(0)}.confetti{position:fixed;z-index:99;width:8px;height:12px;border-radius:3px;pointer-events:none;animation:fall .9s ease-out forwards}@keyframes rise{from{opacity:.65;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes sheet{from{opacity:.65;transform:translateY(34px)}to{opacity:1;transform:none}}@keyframes fall{to{transform:translateY(145px) rotate(300deg);opacity:0}}@media(max-width:380px){.actions,.grid2{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr 1fr}.hero h2{font-size:26px}}
</style>
</head>
<body>
<div id="app" class="app"></div><div id="bottom" class="bottom"></div><div id="overlay" class="overlay"></div><div id="toast" class="toast"></div>
<script>
(()=>{
const KEY='splitzap_mobile_v2',C=['#0f766e','#2563eb','#7c3aed','#db2777','#ea580c','#16a34a'];
let S=load(),draft=null,gDraft=null;
function fresh(){return{tab:'home',groups:[],expenses:[]}}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.groups)&&Array.isArray(x.expenses))return x}catch(e){}return fresh()}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function id(p){return p+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,7)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function money(v){return new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2}).format(Number(v||0))}
function date(v){return v?new Date(v+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):''}
function today(){return new Date().toISOString().slice(0,10)}
function toast(t){const e=document.querySelector('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1900)}
function party(){for(let i=0;i<24;i++){const e=document.createElement('i');e.className='confetti';e.style.background=C[i%C.length];e.style.left=(50+Math.random()*45-22)+'%';e.style.top='58%';e.style.animationDelay=Math.random()*.14+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),1000)}}
function totals(){return{spent:S.expenses.reduce((a,e)=>a+Number(e.amount||0),0),expenses:S.expenses.length,groups:S.groups.length}}
function top(){const t=totals();return`<header class="top"><div class="row between"><div class="row gap10"><div class="logo">S</div><div class="brand"><h1>Splitzap</h1><p>${t.expenses?t.expenses+' expenses':'Split faster'}</p></div></div><div class="row gap8"><button class="icon" onclick="Z.expense()">+</button><button class="icon" onclick="Z.tools()">⋯</button></div></div></header>`}
function empty(i,b,s){return`<div class="empty"><i>${i}</i><b>${b}</b><span>${s}</span></div>`}
function home(){const t=totals();return`<section class="hero"><h2>Split bills fast</h2><p>Simple, lively and ready in seconds.</p><div class="actions"><button class="action primary" onclick="Z.expense()"><span class="e">💸</span><b>Add Expense</b><small>No group needed</small></button><button class="action secondary" onclick="Z.group()"><span class="e">👥</span><b>Create Group</b><small>Trips and roommates</small></button></div><div class="stats"><div class="stat"><b>${money(t.spent)}</b><span>Total</span></div><div class="stat"><b>${t.expenses}</b><span>Expenses</span></div><div class="stat"><b>${t.groups}</b><span>Groups</span></div></div></section><section class="card"><div class="head"><h3>Recent</h3><span>${t.expenses}</span></div>${S.expenses.length?`<div class="list">${S.expenses.slice().sort((a,b)=>b.updated-a.updated).slice(0,4).map(expenseItem).join('')}</div>`:empty('🧾','No expenses yet','Tap Add Expense')}</section>`}
function expenseItem(e){return`<article class="item"><div class="itemIcon">${e.icon||'💸'}</div><div class="itemBody"><b>${esc(e.title)}</b><span>${esc(e.groupName||'Quick expense')} · ${date(e.date)}</span><div class="tinyRow"><button class="tiny" onclick="Z.summary('${e.id}')">Summary</button><button class="tiny" onclick="Z.expense('${e.id}')">Edit</button><button class="tiny" onclick="Z.delExpense('${e.id}')">Delete</button></div></div><div class="amount">${money(e.amount)}</div></article>`}
function groupItem(g){const total=S.expenses.filter(e=>e.groupId===g.id).reduce((a,e)=>a+Number(e.amount||0),0);return`<article class="item"><div class="itemIcon" style="background:linear-gradient(135deg,#7c3aed,#db2777)">${g.icon||'👥'}</div><div class="itemBody"><b>${esc(g.name)}</b><span>${g.people.length} people · ${money(total)}</span><div class="tinyRow"><button class="tiny" onclick="Z.expense(null,'${g.id}')">Add expense</button><button class="tiny" onclick="Z.group('${g.id}')">Edit</button><button class="tiny" onclick="Z.delGroup('${g.id}')">Delete</button></div></div></article>`}
function groups(){return`<section class="card"><div class="head"><h3>Groups</h3><span>${S.groups.length}</span></div><button class="btn full" onclick="Z.group()">+ Create Group</button><div style="height:12px"></div>${S.groups.length?`<div class="list">${S.groups.map(groupItem).join('')}</div>`:empty('👥','No groups yet','Create one when needed')}</section>`}
function ledger(){const l={};S.expenses.forEach(e=>e.splits.forEach(s=>{l[s.name]=(l[s.name]||0)-s.amount;if(s.payer)l[s.name]+=e.amount}));const owes=[],gets=[];Object.entries(l).forEach(([name,v])=>{v=Math.round(v*100)/100;if(v<-.01)owes.push({name,amount:-v});if(v>.01)gets.push({name,amount:v})});owes.sort((a,b)=>b.amount-a.amount);gets.sort((a,b)=>b.amount-a.amount);const debts=[];let i=0,j=0;while(i<owes.length&&j<gets.length){const a=Math.min(owes[i].amount,gets[j].amount);debts.push({from:owes[i].name,to:gets[j].name,amount:Math.round(a*100)/100});owes[i].amount-=a;gets[j].amount-=a;if(owes[i].amount<.01)i++;if(gets[j].amount<.01)j++}return debts}
function activity(){const d=ledger(),t=totals();return`<section class="summary"><h3>Settlement</h3><p>${d.length?d.length+' payment'+(d.length>1?'s':''):'Everyone is settled'}</p><div class="stats"><div class="stat"><b>${money(t.spent)}</b><span>Total</span></div><div class="stat"><b>${t.expenses}</b><span>Expenses</span></div><div class="stat"><b>${d.length}</b><span>Payments</span></div></div><div class="grid2" style="margin-top:12px"><button class="whatsapp" onclick="Z.shareAll()">Share</button><button class="ghost" onclick="Z.settlement()">View</button></div></section><section class="card"><div class="head"><h3>Activity</h3><span>${S.expenses.length}</span></div>${S.expenses.length?`<div class="list">${S.expenses.slice().sort((a,b)=>b.updated-a.updated).map(expenseItem).join('')}</div>`:empty('✨','Nothing yet','Add your first expense')}</section>`}
function screen(){return S.tab==='groups'?groups():S.tab==='activity'?activity():home()}
function nav(){document.querySelector('#bottom').innerHTML=`<nav class="nav">${[['home','🏠','Home'],['activity','📋','Activity'],['groups','👥','Groups']].map(x=>`<button class="${S.tab===x[0]?'active':''}" onclick="Z.tab('${x[0]}')"><i>${x[1]}</i>${x[2]}</button>`).join('')}</nav>`}
function render(){document.querySelector('#app').innerHTML=top()+screen();nav()}
function sheet(title,html){const o=document.querySelector('#overlay');o.innerHTML=`<section class="sheet"><div class="sheetHead"><h3>${esc(title)}</h3><button class="icon" onclick="Z.close()">×</button></div><div class="sheetBody">${html}</div></section>`;o.classList.add('show');document.body.style.overflow='hidden'}
function close(){const o=document.querySelector('#overlay');o.classList.remove('show');o.innerHTML='';document.body.style.overflow=''}
document.querySelector('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')close()})
function tools(){sheet('Tools',`<div class="grid2"><button class="ghost" onclick="Z.exportData()">Export</button><button class="ghost" onclick="Z.importData()">Import</button></div><button class="danger full" style="margin-top:12px" onclick="Z.reset()">Reset all</button>`)}
function group(gid){const old=gid?S.groups.find(g=>g.id===gid):null;gDraft=old?JSON.parse(JSON.stringify(old)):{id:null,name:'',icon:'👥',people:[]};sheet(old?'Edit group':'Create group',`<div class="field"><label>Group name</label><input id="gName" placeholder="Goa Trip" value="${esc(gDraft.name)}" oninput="gDraft.name=this.value"></div><div class="field"><label>Add people</label><div class="grid2"><input id="gPerson" placeholder="Name"><button class="soft" onclick="Z.addGroupPerson()">Add</button></div></div><div id="gPeople">${groupPeople()}</div><button class="btn full" style="margin-top:12px" onclick="Z.saveGroup()">${old?'Save group':'Create group'}</button>`)}
function groupPeople(){return gDraft.people.length?`<div class="chips">${gDraft.people.map(p=>`<span class="chip">${esc(p.name)}<button onclick="Z.removeGroupPerson('${p.id}')">×</button></span>`).join('')}</div>`:empty('✨','No people yet','Add names above')}
function addGroupPerson(){const e=document.querySelector('#gPerson'),n=e.value.trim();if(!n)return toast('Enter name');gDraft.people.push({id:id('p'),name:n});e.value='';document.querySelector('#gPeople').innerHTML=groupPeople()}
function removeGroupPerson(pid){gDraft.people=gDraft.people.filter(p=>p.id!==pid);document.querySelector('#gPeople').innerHTML=groupPeople()}
function saveGroup(){gDraft.name=(document.querySelector('#gName').value||'').trim();if(!gDraft.name)return toast('Group name required');gDraft.id=gDraft.id||id('g');gDraft.updated=Date.now();const i=S.groups.findIndex(g=>g.id===gDraft.id);i>=0?S.groups[i]=gDraft:S.groups.push(gDraft);save();close();render();party();toast(i>=0?'Group updated':'Group created')}
function delGroup(gid){if(S.expenses.some(e=>e.groupId===gid))return toast('Delete group expenses first');if(!confirm('Delete group?'))return;S.groups=S.groups.filter(g=>g.id!==gid);save();render();toast('Group deleted')}
function baseDraft(groupId){const g=groupId?S.groups.find(x=>x.id===groupId):null;const people=g?g.people.map((p,i)=>({id:id('p'),name:p.name,payer:i===0})):[];return{id:null,title:'',amount:'',date:today(),groupId:g?.id||'',groupName:g?.name||'',people:people.length?people:[{id:id('p'),name:'',payer:true}],note:''}}
function expense(eid,groupId){const old=eid?S.expenses.find(e=>e.id===eid):null;draft=old?JSON.parse(JSON.stringify(old)):baseDraft(groupId);sheet(old?'Edit expense':'Add expense',expenseForm(old));refreshPeople()}
function expenseForm(old){return`<div class="field"><label>Expense</label><input id="eTitle" placeholder="Dinner" value="${esc(draft.title)}"></div><div class="grid2"><div class="field"><label>Amount</label><input id="eAmount" type="number" min="0" step="0.01" placeholder="0" value="${esc(draft.amount)}"></div><div class="field"><label>Group</label><select id="eGroup" onchange="Z.pickGroup(this.value)"><option value="">No group</option>${S.groups.map(g=>`<option value="${g.id}" ${draft.groupId===g.id?'selected':''}>${esc(g.name)}</option>`).join('')}</select></div></div><div class="notice">Group is optional. Add people directly below.</div><div class="field"><label>Add person</label><div class="grid2"><input id="ePerson" placeholder="Name"><button class="soft" onclick="Z.addExpensePerson()">Add</button></div></div><div id="ePeople"></div><div class="field" style="margin-top:12px"><label>Date</label><input id="eDate" type="date" value="${draft.date||today()}"></div><button class="btn full" onclick="Z.saveExpense()">${old?'Save expense':'Add expense'}</button>`}
function refreshPeople(){const e=document.querySelector('#ePeople');if(!e)return;e.innerHTML=`<div class="people">${draft.people.map((p,i)=>`<div class="person"><div class="personMain"><div class="avatar" style="background:linear-gradient(135deg,${C[i%C.length]},${C[(i+1)%C.length]})">${esc((p.name||'?').slice(0,2).toUpperCase())}</div><input value="${esc(p.name)}" placeholder="Name" oninput="Z.rename('${p.id}',this.value)"></div><div class="row gap8"><button class="payer ${p.payer?'active':''}" onclick="Z.payer('${p.id}')">Paid</button><button class="remove" onclick="Z.removeExpensePerson('${p.id}')">×</button></div></div>`).join('')}</div>`}
function addExpensePerson(){const e=document.querySelector('#ePerson'),n=e.value.trim();if(!n)return toast('Enter name');draft.people.push({id:id('p'),name:n,payer:!draft.people.some(p=>p.payer)});e.value='';refreshPeople()}
function removeExpensePerson(pid){draft.people=draft.people.filter(p=>p.id!==pid);if(draft.people[0]&&!draft.people.some(p=>p.payer))draft.people[0].payer=true;refreshPeople()}
function rename(pid,v){const p=draft.people.find(x=>x.id===pid);if(p)p.name=v}
function payer(pid){draft.people.forEach(p=>p.payer=p.id===pid);refreshPeople()}
function pickGroup(gid){const g=S.groups.find(x=>x.id===gid);draft.groupId=gid||'';draft.groupName=g?.name||'';if(g)draft.people=g.people.map((p,i)=>({id:id('p'),name:p.name,payer:i===0}));refreshPeople()}
function saveExpense(){const title=document.querySelector('#eTitle').value.trim(),amount=Math.round(Number(document.querySelector('#eAmount').value||0)*100)/100,people=draft.people.filter(p=>p.name.trim());if(!title)return toast('Enter expense');if(amount<=0)return toast('Enter amount');if(!people.length)return toast('Add people');if(!people.some(p=>p.payer))people[0].payer=true;const each=Math.floor(amount*100/people.length)/100;let used=0;const splits=people.map((p,i)=>{const a=i===people.length-1?Math.round((amount-used)*100)/100:each;used+=a;return{name:p.name.trim(),amount:a,payer:p.payer}});const groupId=document.querySelector('#eGroup').value,g=S.groups.find(x=>x.id===groupId);const e={...draft,id:draft.id||id('e'),title,amount,date:document.querySelector('#eDate').value||today(),groupId:groupId||'',groupName:g?.name||'',people,splits,payerName:splits.find(x=>x.payer).name,updated:Date.now()};const i=S.expenses.findIndex(x=>x.id===e.id);i>=0?S.expenses[i]=e:S.expenses.push(e);save();close();render();party();toast(i>=0?'Expense updated':'Expense added');setTimeout(()=>summary(e.id),120)}
function delExpense(eid){if(!confirm('Delete expense?'))return;S.expenses=S.expenses.filter(e=>e.id!==eid);save();render();toast('Deleted')}
function expenseDebts(e){const payer=e.splits.find(x=>x.payer);return e.splits.filter(x=>!x.payer&&x.amount>0).map(x=>({from:x.name,to:payer.name,amount:x.amount}))}
function summary(eid){const e=S.expenses.find(x=>x.id===eid);if(!e)return;const d=expenseDebts(e);sheet('Summary',`<div class="summary"><h3>${esc(e.title)}</h3><p>${money(e.amount)} · ${date(e.date)}</p><div class="stats"><div class="stat"><b>${e.splits.length}</b><span>People</span></div><div class="stat"><b>${esc(e.payerName)}</b><span>Paid by</span></div><div class="stat"><b>${d.length}</b><span>Payments</span></div></div></div><div class="card"><div class="head"><h3>Who owes whom</h3><span>${d.length}</span></div>${d.length?`<div class="list">${d.map(x=>`<div class="item"><div class="itemBody"><b>${esc(x.from)} → ${esc(x.to)}</b><span>Settlement</span></div><div class="amount">${money(x.amount)}</div></div>`).join('')}</div>`:empty('✅','Settled','No payment needed')}</div><div class="grid2" style="margin-top:12px"><button class="whatsapp" onclick="Z.shareExpense('${e.id}')">Share</button><button class="ghost" onclick="Z.close()">Close</button></div>`)}
function settlement(){const d=ledger();sheet('Settlement',`<div class="card" style="margin-top:0"><div class="head"><h3>Payments</h3><span>${d.length}</span></div>${d.length?`<div class="list">${d.map(x=>`<div class="item"><div class="itemBody"><b>${esc(x.from)} → ${esc(x.to)}</b><span>Final settlement</span></div><div class="amount">${money(x.amount)}</div></div>`).join('')}</div>`:empty('✅','Settled','No pending payments')}</div><div class="card"><div class="head"><h3>Preview</h3><span>WhatsApp</span></div><div class="preview">${esc(allText())}</div></div><div class="grid2" style="margin-top:12px"><button class="whatsapp" onclick="Z.shareAll()">Share</button><button class="ghost" onclick="Z.copyAll()">Copy</button></div>`)}
function expenseText(e){const d=expenseDebts(e),a=['💸 Splitzap',e.title+' · '+money(e.amount),'Paid by: '+e.payerName,'','Settlement'];d.length?d.forEach(x=>a.push('• '+x.from+' → '+x.to+': '+money(x.amount))):a.push('• Everyone is settled');return a.join('\n')}
function allText(){const d=ledger(),t=totals(),a=['💸 Splitzap','Total: '+money(t.spent),'','Settlement'];d.length?d.forEach(x=>a.push('• '+x.from+' → '+x.to+': '+money(x.amount))):a.push('• Everyone is settled');return a.join('\n')}
function copy(t){navigator.clipboard?.writeText(t).then(()=>{toast('Copied');party()}).catch(()=>fallback(t))||fallback(t)}
function fallback(t){const e=document.createElement('textarea');e.value=t;document.body.appendChild(e);e.select();document.execCommand('copy');e.remove();toast('Copied')}
function share(t){copy(t);window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank')}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='splitzap-backup.json';a.click();URL.revokeObjectURL(a.href);toast('Exported')}
function importData(){const i=document.createElement('input');i.type='file';i.accept='application/json';i.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader;r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.groups)||!Array.isArray(x.expenses))throw 0;S=x;save();close();render();toast('Imported')}catch(_){toast('Invalid file')}};r.readAsText(f)};i.click()}
function reset(){if(!confirm('Reset all data?'))return;S=fresh();save();close();render();toast('Reset done')}
window.gDraft=gDraft;window.Z={tab:t=>{S.tab=t;save();render()},close,tools,group,addGroupPerson,removeGroupPerson,saveGroup,delGroup,expense,addExpensePerson,removeExpensePerson,rename,payer,pickGroup,saveExpense,delExpense,summary,settlement,shareExpense:id=>{const e=S.expenses.find(x=>x.id===id);if(e)share(expenseText(e))},shareAll:()=>S.expenses.length?share(allText()):toast('No expenses'),copyAll:()=>S.expenses.length?copy(allText()):toast('No expenses'),exportData,importData,reset};
render();
})();
</script>
</body>
</html>
